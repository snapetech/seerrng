extensions:
  # createSafeHttpUrl performs scheme, credential, host, DNS, and private-address
  # validation before returning a URL that is used as a request target.
  - addsTo:
      pack: codeql/javascript-all
      extensible: barrierModel
    data:
      - ['@server/utils/security', 'Member[createSafeHttpUrl].ReturnValue.Awaited', 'request-forgery']
      - ['@server/utils/security', 'Member[createSafeHttpUrl].ReturnValue.Awaited', 'file-access-to-http']
      - ['@server/utils/security', 'Member[createSafeHttpUrl].ReturnValue.Awaited.Member[toString].ReturnValue', 'request-forgery']
      - ['@server/utils/security', 'Member[createSafeHttpUrl].ReturnValue.Awaited.Member[toString].ReturnValue', 'file-access-to-http']
      - ['@server/utils/security', 'Member[stringifySafeHttpUrl].ReturnValue', 'request-forgery']
      - ['@server/utils/security', 'Member[stringifySafeHttpUrl].ReturnValue', 'file-access-to-http']

  # Callers only use a URL after the asynchronous validator accepts it.
  - addsTo:
      pack: codeql/javascript-all
      extensible: barrierGuardModel
    data:
      - ['@server/utils/security', 'Member[isSafeHttpUrl].Argument[0]', 'true', 'request-forgery']

  # ExternalAPI validates configured origins and constrains every Axios request
  # to the configured origin. Its first argument is an administrator-controlled
  # service endpoint, including private addresses for self-hosted integrations.
  - addsTo:
      pack: codeql/javascript-all
      extensible: barrierModel
    data:
      - ['@server/api/externalapi', 'Member[ExternalAPI].Argument[0]', 'request-forgery']

  # Servarr URLs are administrator-configured service origins. This helper
  # rejects non-HTTP schemes, missing hosts, and embedded credentials before
  # the value becomes an ExternalAPI base URL.
  - addsTo:
      pack: codeql/javascript-all
      extensible: barrierModel
    data:
      - ['@server/api/servarr/base', 'Member[normalizeConfiguredServiceUrl].ReturnValue', 'request-forgery']
      - ['@server/api/servarr/base', 'Member[normalizeConfiguredServiceUrl].ReturnValue', 'file-access-to-http']

  # A true result means the supplied API key matched the configured secret
  # using a length check and constant-time comparison.
  - addsTo:
      pack: codeql/javascript-all
      extensible: barrierGuardModel
    data:
      - ['@server/middleware/auth', 'Member[matchesApiKey].Argument[0]', 'true', 'user-controlled-bypass']

  # These parsers enforce the shape and protocol of administrator-configured
  # media-service endpoints before the settings are persisted or used.
  - addsTo:
      pack: codeql/javascript-all
      extensible: barrierModel
    data:
      - ['@server/routes/settings/index', 'Member[parsePlexSettingsBody].ReturnValue', 'request-forgery']
      - ['@server/routes/settings/index', 'Member[parseJellyfinSettingsBody].ReturnValue', 'request-forgery']
      - ['@server/routes/settings/index', 'Member[parseTautulliSettingsBody].ReturnValue', 'request-forgery']
      - ['@server/routes/settings/index', 'Member[parsePlexSettingsBody].ReturnValue', 'file-access-to-http']
      - ['@server/routes/settings/index', 'Member[parseJellyfinSettingsBody].ReturnValue', 'file-access-to-http']
      - ['@server/routes/settings/index', 'Member[parseTautulliSettingsBody].ReturnValue', 'file-access-to-http']

  - addsTo:
      pack: codeql/javascript-all
      extensible: barrierModel
    data:
      - ['@server/lib/imageproxy', 'Member[prepareRasterImageForCache].ReturnValue', 'http-to-file-access']
      - ['@server/lib/imageproxy', 'Member[prepareRasterImageForCache].ReturnValue.Member[buffer]', 'http-to-file-access']

  # getSettings returns the application configuration after its authenticated
  # settings-admission and validation paths. Its values are intentionally used
  # for configured service endpoints and notification credentials.
  - addsTo:
      pack: codeql/javascript-all
      extensible: barrierModel
    data:
      - ['@server/api/externalapi', 'Member[normalizeExternalApiRequestTarget].ReturnValue', 'request-forgery']
      - ['@server/lib/externalRuntimeConfig', 'Member[getExternalRuntimeConfig].ReturnValue', 'file-access-to-http']
      - ['@server/lib/externalRuntimeConfig', 'Member[getExternalRuntimeConfig].ReturnValue.Fuzzy', 'file-access-to-http']
      # Settings.data is the private, typed application-configuration store.
      # Values leave this boundary only through validated settings accessors.
      - ['@server/lib/settings.Settings', 'Member[data]', 'file-access-to-http']
      - ['@server/lib/settings/index.Settings', 'Member[data]', 'file-access-to-http']
      - ['@server/lib/settings', 'Member[getSettings].ReturnValue', 'request-forgery']
      - ['@server/lib/settings', 'Member[getSettings].ReturnValue', 'file-access-to-http']
      - ['@server/lib/settings', 'Member[getSettings].ReturnValue.Fuzzy', 'request-forgery']
      - ['@server/lib/settings', 'Member[getSettings].ReturnValue.Fuzzy', 'file-access-to-http']
      - ['@server/lib/settings/index', 'Member[getSettings].ReturnValue.Fuzzy', 'request-forgery']
      - ['@server/lib/settings/index', 'Member[getSettings].ReturnValue.Fuzzy', 'file-access-to-http']
      - ['@server/utils/security', 'Member[createSafeHttpUrl].ReturnValue.Awaited.Member[href]', 'request-forgery']
      - ['@server/utils/security', 'Member[createSafeHttpUrl].ReturnValue.Awaited.Member[href]', 'file-access-to-http']
