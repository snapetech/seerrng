---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: 'CodeQL'

on:
  workflow_call:
    inputs:
      plan_sha256:
        required: true
        type: string
      engine_run_id:
        required: true
        type: string
      engine_run_attempt:
        required: true
        type: string
      execution_sha:
        required: true
        type: string
      unit_id:
        required: true
        type: string
  schedule:
    - cron: '50 7 * * 5'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript]
    env:
      SEERRNG_ENGINE_PLAN_SHA256: ${{ inputs.plan_sha256 }}
      SEERRNG_ENGINE_RUN_ID: ${{ inputs.engine_run_id }}
      SEERRNG_ENGINE_RUN_ATTEMPT: ${{ inputs.engine_run_attempt }}
      SEERRNG_ENGINE_EXECUTION_SHA: ${{ inputs.execution_sha }}
      SEERRNG_ENGINE_UNIT_ID: ${{ inputs.unit_id }}
      SEERRNG_ENGINE_CASE: ${{ matrix.language }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js for engine binding
        if: inputs.plan_sha256 != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          package-manager-cache: false

      - name: Download immutable validation plan
        if: inputs.plan_sha256 != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: seerrng-engine-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seerrng-engine-plan

      - name: Admit engine unit case
        id: engine-admission
        if: inputs.plan_sha256 != ''
        run: >-
          node bin/run-local-validation.mjs
          --github-admit
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --case "$SEERRNG_ENGINE_CASE"
          --plan-file "$RUNNER_TEMP/seerrng-engine-plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-receipts"
          --json

      - name: Initialize CodeQL
        if: >-
          inputs.plan_sha256 == '' ||
          steps.engine-admission.outputs.execute == 'true'
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality
          packs: ${{ matrix.language == 'javascript' && 'snapetech/seerrng-codeql-models@0.0.15' || '' }}
          token: ${{ github.token }}

      - name: Autobuild
        if: >-
          inputs.plan_sha256 == '' ||
          steps.engine-admission.outputs.execute == 'true'
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

      - name: Perform CodeQL Analysis
        if: >-
          inputs.plan_sha256 == '' ||
          steps.engine-admission.outputs.execute == 'true'
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: '/language:${{ matrix.language }}'

      - name: Seal engine unit case receipt
        if: >-
          always() &&
          inputs.plan_sha256 != '' &&
          steps.engine-admission.outputs.execute == 'true'
        run: >-
          node bin/run-local-validation.mjs
          --github-receipt
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --case "$SEERRNG_ENGINE_CASE"
          --plan-file "$RUNNER_TEMP/seerrng-engine-plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-receipts"
          --job-status "${{ job.status }}"
          --json

      - name: Publish engine unit case receipt
        if: always() && inputs.plan_sha256 != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seerrng-engine-receipt-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.unit_id }}-${{ matrix.language }}
          path: ${{ runner.temp }}/seerrng-engine-receipts
          if-no-files-found: error
          retention-days: 1
