---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: SeerrNG CI

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_HUB: snapetech/seerrng

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-notes:
    name: Release-note contract
    timeout-minutes: 10
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          package-manager-cache: false

      - name: Validate release-note fragment or explicit opt-out
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BODY: ${{ github.event_name == 'pull_request' && github.event.pull_request.body || '' }}
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/pr-body.md"
          printf '%s' "$PR_BODY" > "$body_file"
          node scripts/check-release-notes.mjs \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --pr-body "$body_file" \
            --summary-file "$GITHUB_STEP_SUMMARY"
          node scripts/check-changelog-tags.mjs

  i18n:
    name: i18n Check
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'

      - name: Pnpm Setup
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        env:
          CI: true
        run: pnpm install

      - name: i18n Check
        run: node bin/check-i18n.js

      - name: Security council and tooling tests
        run: pnpm security:council
  test:
    name: Lint & Test Build
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    container:
      image: node:22.22.2-alpine3.23@sha256:8ea2348b068a9544dae7317b4f3aafcdc032df1647bb7d768a05a5cad1a7683f
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pnpm Setup
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Get pnpm store directory
        shell: sh
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        env:
          CI: true
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      - name: Build
        run: pnpm build

  unit-test:
    name: Unit Tests
    timeout-minutes: 45
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    container:
      image: node:22.22.2-alpine3.23@sha256:8ea2348b068a9544dae7317b4f3aafcdc032df1647bb7d768a05a5cad1a7683f
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pnpm Setup
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Get pnpm store directory
        shell: sh
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
          echo "LOCK_HASH=$(sha256sum pnpm-lock.yaml | cut -d ' ' -f 1)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ env.LOCK_HASH }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        env:
          CI: true
        run: pnpm install

      - name: Run tests
        env:
          CI: true
        run: pnpm test

      - name: Publish test report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: 'report.xml'

  preflight-deploy:
    name: Preflight deployment host
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, seerrng, linux-build, kspls0]
    permissions:
      contents: read
    env:
      SEERRNG_CONFIG_DIR: ${{ vars.SEERRNG_CONFIG_DIR || '/mnt/datapool_lvm_media/seerrng-config' }}
    steps:
      - name: Verify deployment storage is mounted read-write
        shell: bash
        run: |
          set -euo pipefail
          test -d "$SEERRNG_CONFIG_DIR" || {
            echo "Deployment config directory does not exist: $SEERRNG_CONFIG_DIR" >&2
            exit 1
          }
          mount_options="$(findmnt -T "$SEERRNG_CONFIG_DIR" -no OPTIONS)"
          echo "Deployment mount options: $mount_options"
          if [[ ",$mount_options," == *,ro,* || ",$mount_options," == *,emergency_ro,* ]]; then
            echo 'Deployment storage is read-only; refusing deployment until the host is repaired.' >&2
            findmnt -T "$SEERRNG_CONFIG_DIR" -o TARGET,SOURCE,FSTYPE,OPTIONS >&2 || true
            df -hT "$SEERRNG_CONFIG_DIR" >&2 || true
            sudo -n lvs -o lv_name,vg_name,lv_attr,lv_size,devices >&2 || true
            exit 1
          fi
          [[ ",$mount_options," == *,rw,* ]] || {
            echo "Deployment storage is not mounted read-write: $mount_options" >&2
            exit 1
          }
          used_percent="$(df -P "$SEERRNG_CONFIG_DIR" | awk 'NR == 2 { gsub(/%/, "", $5); print $5 }')"
          [[ "$used_percent" =~ ^[0-9]+$ && "$used_percent" -lt 99 ]] || {
            echo "Deployment storage is ${used_percent:-unknown}% full; refusing release." >&2
            df -hT "$SEERRNG_CONFIG_DIR" >&2 || true
            exit 1
          }
          probe="$(mktemp "$SEERRNG_CONFIG_DIR/.seerrng-ci-write-test.XXXXXX")"
          rm -f -- "$probe"

  publish:
    name: Publish multi-arch image
    timeout-minutes: 90
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: seerrng-main-image-publish
      cancel-in-progress: true
    runs-on:
      [self-hosted, seerrng, linux-build, linux-amd64, linux-arm64-cross]
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_digest: ${{ steps.resolve-digest.outputs.image_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Commit timestamp
        id: ts
        run: echo "TIMESTAMP=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - name: Image channel
        id: channel
        run: echo "CHANNEL=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          driver-opts: network=host

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.channel.outputs.CHANNEL }}
            type=sha
          labels: |
            org.opencontainers.image.created=${{ steps.ts.outputs.TIMESTAMP }}

      - name: Resolve base images with retry
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t base_images < <(
            awk '
              toupper($1) == "FROM" {
                image = ""
                for (i = 2; i <= NF; i++) {
                  if ($i ~ /^--/) {
                    continue
                  }
                  image = $i
                  break
                }
                if (image != "") {
                  images[image] = 1
                }
                for (i = 2; i < NF; i++) {
                  if (toupper($i) == "AS") {
                    aliases[$(i + 1)] = 1
                  }
                }
              }
              END {
                for (image in images) {
                  if (!(image in aliases)) {
                    print image
                  }
                }
              }
            ' Dockerfile | sort -u
          )
          for image in "${base_images[@]}"; do
            for attempt in 1 2 3 4 5; do
              echo "Resolving ${image} (attempt ${attempt}/5)"
              if docker buildx imagetools inspect "$image" >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Unable to resolve ${image} after ${attempt} attempts" >&2
                exit 1
              fi
              sleep $((attempt * 15))
            done
          done

      - name: Build & Push (multi-arch, single tag)
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_LABELS: ${{ steps.meta.outputs.labels }}
          COMMIT_TAG: ${{ github.sha }}
          BUILD_VERSION: ${{ steps.channel.outputs.CHANNEL }}
          SOURCE_DATE_EPOCH: ${{ steps.ts.outputs.TIMESTAMP }}
        run: |
          set -euo pipefail

          build_args=(
            --file ./Dockerfile
            --platform linux/amd64,linux/arm64
            --push
            --build-arg "COMMIT_TAG=${COMMIT_TAG}"
            --build-arg "BUILD_VERSION=${BUILD_VERSION}"
            --build-arg "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}"
            --cache-from type=gha,scope=linux/amd64
            --cache-from type=gha,scope=linux/arm64
            --cache-to type=gha,mode=max
            --provenance mode=max
          )

          while IFS= read -r tag; do
            [ -n "$tag" ] && build_args+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"

          while IFS= read -r label; do
            [ -n "$label" ] && build_args+=(--label "$label")
          done <<< "$IMAGE_LABELS"

          for attempt in 1 2 3; do
            echo "Building and pushing image (attempt ${attempt}/3)"
            if docker buildx build "${build_args[@]}" .; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Image build/push failed after ${attempt} attempts" >&2
              exit 1
            fi
            sleep $((attempt * 30))
          done

      - name: Verify published architectures
        shell: bash
        run: |
          set -euo pipefail
          image_name="ghcr.io/${GITHUB_REPOSITORY}"
          scripts/verify-container-manifest.sh --require-provenance "${image_name}:main" linux/amd64 linux/arm64
          scripts/verify-container-manifest.sh --require-provenance "${image_name}:sha-${GITHUB_SHA::7}" linux/amd64 linux/arm64

      - name: Resolve published image digest
        id: resolve-digest
        shell: bash
        run: |
          set -euo pipefail
          image_name="ghcr.io/${GITHUB_REPOSITORY}"
          for attempt in 1 2 3 4 5; do
            echo "Resolving published image digest (attempt ${attempt}/5)"
            if digest=$(docker buildx imagetools inspect "${image_name}:main" --format '{{json .Manifest.Digest}}' | tr -d '"') &&
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "image_digest=$digest" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo 'Unable to resolve the published image digest after 5 attempts.' >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done

  scan-main-image:
    name: Scan main image (${{ matrix.platform }})
    if: github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      TRIVY_CACHE_DIR: .trivycache
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Trivy DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .trivycache
          key: trivy-${{ runner.os }}-${{ hashFiles('**/Dockerfile') }}
          restore-keys: |
            trivy-${{ runner.os }}-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: 0.58.2

      - name: Run Trivy image scan
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          trivy image \
            --platform "$PLATFORM" \
            --format sarif \
            --output "trivy-main-${{ matrix.suffix }}.sarif" \
            --ignore-unfixed \
            "ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.image_digest }}"

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-main-${{ matrix.suffix }}.sarif
          category: trivy-main-${{ matrix.suffix }}

  deploy-main:
    name: Deploy main to seerr.home
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'
    needs: [publish, preflight-deploy]
    concurrency:
      group: seerrng-live-deploy
      cancel-in-progress: false
    runs-on: [self-hosted, seerrng, linux-build, kspls0]
    permissions:
      contents: read
      packages: read
    env:
      SEERRNG_CONTAINER_NAME: ${{ vars.SEERRNG_CONTAINER_NAME || 'seerr-host' }}
      SEERRNG_PORT: ${{ vars.SEERRNG_PORT || '5055' }}
      SEERRNG_CONFIG_DIR: ${{ vars.SEERRNG_CONFIG_DIR || '/mnt/datapool_lvm_media/seerrng-config' }}
      SEERRNG_IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          driver-opts: network=host

      - name: Log in to GitHub Container Registry on seerr.home
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username '${{ github.repository_owner }}' --password-stdin

      - name: Pull latest main image
        run: |
          set -euo pipefail
          image_name="ghcr.io/${GITHUB_REPOSITORY}"
          digest="${SEERRNG_IMAGE_DIGEST:?The publish job did not provide an image digest}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo 'The publish job returned an invalid image digest.' >&2
            exit 1
          }
          image_ref="${image_name}@${digest}"
          docker pull "$image_ref"
          printf 'SEERRNG_IMAGE_REF=%s\n' "$image_ref" >> "$GITHUB_ENV"

      - name: Validate deployment inputs
        run: |
          set -euo pipefail
          if [[ ! "$SEERRNG_CONTAINER_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,110}$ ]]; then
            echo 'Invalid deployment container name.' >&2
            exit 1
          fi
          if [[ ! "$SEERRNG_PORT" =~ ^[0-9]{1,5}$ ]] ||
             (( 10#$SEERRNG_PORT < 1 || 10#$SEERRNG_PORT > 65535 )); then
            echo 'Invalid deployment port.' >&2
            exit 1
          fi
          if [[ "$SEERRNG_CONFIG_DIR" != /* ||
                "$SEERRNG_CONFIG_DIR" == *:* ||
                "$SEERRNG_CONFIG_DIR" =~ [[:cntrl:]] ||
                ${#SEERRNG_CONFIG_DIR} -gt 4096 ]]; then
            echo 'Invalid deployment config directory.' >&2
            exit 1
          fi

      - name: Prepare config directory
        run: |
          docker run --rm --user 0 \
            --entrypoint sh \
            -v "$SEERRNG_CONFIG_DIR:/config" \
            "$SEERRNG_IMAGE_REF" \
            -c 'chown 1000:1000 /config && chmod 0755 /config'

      - name: Deploy seerr.home
        id: deploy-main
        run: |
          set -euo pipefail
          external_config_file="$(mktemp)"
          external_env_file="$(mktemp)"
          external_config_args=()
          trap 'rm -f "$external_config_file" "$external_env_file"' EXIT
          if [[ -f "$SEERRNG_CONFIG_DIR/settings.json" ]]; then
            docker run --rm \
              --user 1000:1000 \
              --entrypoint node \
              -v "$SEERRNG_CONFIG_DIR:/config:ro" \
              "$SEERRNG_IMAGE_REF" \
              /app/scripts/export-external-config.mjs /config/settings.json \
              > "$external_config_file"
            printf 'SEERR_EXTERNAL_CONFIG=%s\n' "$(cat "$external_config_file")" \
              > "$external_env_file"
            external_config_args=(--env-file "$external_env_file")
          else
            echo 'No settings.json found; starting SeerrNG so it can initialize the config.'
          fi
          if [[ ! "$SEERRNG_CONTAINER_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,110}$ ]]; then
            echo 'Invalid deployment container name.' >&2
            exit 1
          fi
          rollback_container="${SEERRNG_CONTAINER_NAME}-rollback"
          echo 'cutover_started=true' >> "$GITHUB_OUTPUT"
          if docker inspect "$rollback_container" >/dev/null 2>&1; then
            # A prior runner interruption left a known-good rollback. Preserve
            # it and discard only the unverified current generation.
            docker rm -f "$SEERRNG_CONTAINER_NAME" 2>/dev/null || true
          elif docker inspect "$SEERRNG_CONTAINER_NAME" >/dev/null 2>&1; then
            docker stop --time 30 "$SEERRNG_CONTAINER_NAME"
            docker rename "$SEERRNG_CONTAINER_NAME" "$rollback_container"
          fi
          docker run -d \
            --name "$SEERRNG_CONTAINER_NAME" \
            --restart unless-stopped \
            --init \
            --user 1000:1000 \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=1777 \
            --tmpfs /app/.next/cache:rw,noexec,nosuid,nodev,size=256m,uid=1000,gid=1000,mode=0700 \
            --health-cmd "node -e \"fetch('http://127.0.0.1:' + process.env.PORT + '/api/v1/status/ready').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"" \
            --health-interval 10s \
            --health-timeout 5s \
            --health-retries 12 \
            --health-start-period 20s \
            --network host \
            "${external_config_args[@]}" \
            -e TZ="${TZ:-America/Regina}" \
            -e PORT="$SEERRNG_PORT" \
            -e CONFIG_DIRECTORY=/app/config \
            -e LOG_LEVEL="${LOG_LEVEL:-info}" \
            -v "$SEERRNG_CONFIG_DIR:/app/config" \
            "$SEERRNG_IMAGE_REF"

      - name: Verify seerr.home deployment
        run: |
          set -euo pipefail
          status_file="$RUNNER_TEMP/seerr-main-status.json"
          rm -f "$status_file"
          docker ps --filter "name=^/${SEERRNG_CONTAINER_NAME}$" --filter "status=running" --format '{{.Names}}' | grep -qx "$SEERRNG_CONTAINER_NAME"
          status_ready=false
          for i in $(seq 1 90); do
            if docker exec "$SEERRNG_CONTAINER_NAME" node -e \
              "const port = process.argv[1]; fetch('http://127.0.0.1:' + port + '/api/v1/status').then(async response => { if (!response.ok) process.exit(1); process.stdout.write(await response.text()); }).catch(() => process.exit(1))" \
              "$SEERRNG_PORT" \
              > "$status_file"; then
              status_ready=true
              cat "$status_file"
              break
            fi
            sleep 2
          done
          test "$status_ready" = true
          short_sha="${GITHUB_SHA::8}"
          grep -Eq "\"commitTag\":\"(${GITHUB_SHA}|${short_sha})\"" "$status_file"

      - name: Remove verified rollback container
        if: success()
        run: docker rm -f "${SEERRNG_CONTAINER_NAME}-rollback" 2>/dev/null || true

      - name: Restore previous seerr.home deployment
        if: (failure() || cancelled()) && steps.deploy-main.outputs.cutover_started == 'true'
        run: |
          set -euo pipefail
          rollback_container="${SEERRNG_CONTAINER_NAME}-rollback"
          if docker inspect "$rollback_container" >/dev/null 2>&1; then
            docker rm -f "$SEERRNG_CONTAINER_NAME" 2>/dev/null || true
            docker rename "$rollback_container" "$SEERRNG_CONTAINER_NAME"
            docker start "$SEERRNG_CONTAINER_NAME"
          elif docker inspect "$SEERRNG_CONTAINER_NAME" >/dev/null 2>&1; then
            # Cancellation can land after stop but before rename.
            docker start "$SEERRNG_CONTAINER_NAME" >/dev/null
          else
            echo 'No previous deployment was available to restore.' >&2
          fi
