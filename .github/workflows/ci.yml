---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: SeerrNG CI

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_main:
        description: Deploy the published image to seerr.home after its scan passes.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  DOCKER_HUB: snapetech/seerrng
  GHCR_IMAGE: ghcr.io/snapetech/seerrng

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engine-plan:
    name: Validation engine plan
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      planSha256: ${{ steps.plan.outputs.planSha256 }}
      runId: ${{ steps.plan.outputs.runId }}
      runAttempt: ${{ steps.plan.outputs.runAttempt }}
      executionSha: ${{ steps.plan.outputs.executionSha }}
      headSha: ${{ steps.plan.outputs.headSha }}
      codeql: ${{ steps.plan.outputs.codeql }}
      cypress: ${{ steps.plan.outputs.cypress }}
      playwright: ${{ steps.plan.outputs.playwright }}
      testDocs: ${{ steps.plan.outputs.testDocs }}
      docsLinks: ${{ steps.plan.outputs.docsLinks }}
      helm: ${{ steps.plan.outputs.helm }}
      unitMatrix: ${{ steps.plan.outputs.unitMatrix }}
      cypressMatrix: ${{ steps.plan.outputs.cypressMatrix }}
    steps:
      - name: Checkout complete candidate history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          package-manager-cache: false

      - name: Create current-run hosted validation plan
        id: plan
        run: |
          mkdir -p "$RUNNER_TEMP/seerrng-engine-plan"
          node bin/run-local-validation.mjs \
            --github-plan \
            --plan-file "$RUNNER_TEMP/seerrng-engine-plan/hosted-plan.json" \
            --json

      - name: Publish immutable current-attempt validation plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seerrng-engine-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seerrng-engine-plan/hosted-plan.json
          if-no-files-found: error
          retention-days: 1

  jellyfin-plugin:
    name: Build Jellyfin bridge plugin
    needs: engine-plan
    timeout-minutes: 15
    if: >-
      always() &&
      !cancelled() &&
      needs.engine-plan.result == 'success' &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SEERRNG_ENGINE_PLAN_SHA256: ${{ needs.engine-plan.outputs.planSha256 }}
      SEERRNG_ENGINE_RUN_ID: ${{ needs.engine-plan.outputs.runId }}
      SEERRNG_ENGINE_RUN_ATTEMPT: ${{ needs.engine-plan.outputs.runAttempt }}
      SEERRNG_ENGINE_EXECUTION_SHA: ${{ needs.engine-plan.outputs.executionSha }}
      SEERRNG_ENGINE_UNIT_ID: ci-jellyfin-plugin
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js for engine binding
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          package-manager-cache: false

      - name: Download immutable validation plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: seerrng-engine-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seerrng-engine-plan

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - name: Admit engine unit
        id: engine-admission
        run: >-
          node bin/run-local-validation.mjs
          --github-admit
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --plan-file "$RUNNER_TEMP/seerrng-engine-plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-receipts"
          --json

      - name: Build plugin
        if: steps.engine-admission.outputs.execute == 'true'
        run: >-
          dotnet publish
          integrations/jellyfin-plugin/SeerrNG.JellyfinBridge.csproj
          --configuration Release
          --output artifacts/seerrng-jellyfin-bridge

      - name: Smoke test plugin in Jellyfin 10.11.11
        if: steps.engine-admission.outputs.execute == 'true'
        run: >-
          python3 integrations/jellyfin-plugin/smoke-test.py
          --plugin-output artifacts/seerrng-jellyfin-bridge

      - name: Seal engine unit receipt
        if: always() && steps.engine-admission.outputs.execute == 'true'
        run: >-
          node bin/run-local-validation.mjs
          --github-receipt
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --plan-file "$RUNNER_TEMP/seerrng-engine-plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-receipts"
          --job-status "${{ job.status }}"
          --json

      - name: Publish engine unit receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seerrng-engine-receipt-${{ github.run_id }}-${{ github.run_attempt }}-ci-jellyfin-plugin
          path: ${{ runner.temp }}/seerrng-engine-receipts
          if-no-files-found: error
          retention-days: 1

  release-notes:
    name: Release-note contract
    needs: engine-plan
    timeout-minutes: 10
    if: >-
      always() &&
      !cancelled() &&
      needs.engine-plan.result == 'success' &&
      (github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.user.type != 'Bot'))
    runs-on: ubuntu-latest
    env:
      SEERRNG_ENGINE_PLAN_SHA256: ${{ needs.engine-plan.outputs.planSha256 }}
      SEERRNG_ENGINE_RUN_ID: ${{ needs.engine-plan.outputs.runId }}
      SEERRNG_ENGINE_RUN_ATTEMPT: ${{ needs.engine-plan.outputs.runAttempt }}
      SEERRNG_ENGINE_EXECUTION_SHA: ${{ needs.engine-plan.outputs.executionSha }}
      SEERRNG_ENGINE_UNIT_ID: ci-release-notes
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          package-manager-cache: false

      - name: Download immutable validation plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: seerrng-engine-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seerrng-engine-plan

      - name: Admit engine unit
        id: engine-admission
        run: >-
          node bin/run-local-validation.mjs
          --github-admit
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --plan-file "$RUNNER_TEMP/seerrng-engine-plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-receipts"
          --json

      - name: Validate release-note fragment or explicit opt-out
        if: steps.engine-admission.outputs.execute == 'true'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          # Push events do not include a pull-request body. Allow an explicitly
          # marked internal-only commit to satisfy the same release-note contract.
          PR_BODY: ${{ github.event_name == 'pull_request' && github.event.pull_request.body || github.event.head_commit.message || '' }}
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/pr-body.md"
          printf '%s' "$PR_BODY" > "$body_file"
          validation_args=()
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            validation_args+=(--allow-mixed-push-batch)
          fi
          node scripts/check-release-notes.mjs \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --pr-body "$body_file" \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            "${validation_args[@]}"
          node scripts/check-changelog-tags.mjs

      - name: Seal engine unit receipt
        if: always() && steps.engine-admission.outputs.execute == 'true'
        run: >-
          node bin/run-local-validation.mjs
          --github-receipt
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --plan-file "$RUNNER_TEMP/seerrng-engine-plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-receipts"
          --job-status "${{ job.status }}"
          --json

      - name: Publish engine unit receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seerrng-engine-receipt-${{ github.run_id }}-${{ github.run_attempt }}-ci-release-notes
          path: ${{ runner.temp }}/seerrng-engine-receipts
          if-no-files-found: error
          retention-days: 1

  i18n:
    name: i18n Check
    needs: engine-plan
    timeout-minutes: 30
    if: >-
      always() &&
      !cancelled() &&
      needs.engine-plan.result == 'success' &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    env:
      SEERRNG_ENGINE_PLAN_SHA256: ${{ needs.engine-plan.outputs.planSha256 }}
      SEERRNG_ENGINE_RUN_ID: ${{ needs.engine-plan.outputs.runId }}
      SEERRNG_ENGINE_RUN_ATTEMPT: ${{ needs.engine-plan.outputs.runAttempt }}
      SEERRNG_ENGINE_EXECUTION_SHA: ${{ needs.engine-plan.outputs.executionSha }}
      SEERRNG_ENGINE_UNIT_ID: ci-i18n
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'

      - name: Download immutable validation plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: seerrng-engine-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seerrng-engine-plan

      - name: Pnpm Setup
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-node24-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node24-pnpm-store-

      - name: Install dependencies
        env:
          CI: true
        run: pnpm install

      - name: Admit engine unit
        id: engine-admission
        run: >-
          node bin/run-local-validation.mjs
          --github-admit
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --plan-file "$RUNNER_TEMP/seerrng-engine-plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-receipts"
          --json

      - name: i18n Check
        if: steps.engine-admission.outputs.execute == 'true'
        run: node bin/check-i18n.js

      - name: Security council and tooling tests
        if: steps.engine-admission.outputs.execute == 'true'
        run: pnpm security:council

      - name: Seal engine unit receipt
        if: always() && steps.engine-admission.outputs.execute == 'true'
        run: >-
          node bin/run-local-validation.mjs
          --github-receipt
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --plan-file "$RUNNER_TEMP/seerrng-engine-plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-receipts"
          --job-status "${{ job.status }}"
          --json

      - name: Publish engine unit receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seerrng-engine-receipt-${{ github.run_id }}-${{ github.run_attempt }}-ci-i18n
          path: ${{ runner.temp }}/seerrng-engine-receipts
          if-no-files-found: error
          retention-days: 1

  test:
    name: Lint & Test Build
    needs: engine-plan
    timeout-minutes: 30
    if: >-
      always() &&
      !cancelled() &&
      needs.engine-plan.result == 'success' &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    container:
      image: node:24.21.0-alpine3.23@sha256:9ec4a2e289874ed0d722e1772ec2de45d2801541db8612f3638b26f128c69ac2
    env:
      SEERRNG_ENGINE_PLAN_SHA256: ${{ needs.engine-plan.outputs.planSha256 }}
      SEERRNG_ENGINE_RUN_ID: ${{ needs.engine-plan.outputs.runId }}
      SEERRNG_ENGINE_RUN_ATTEMPT: ${{ needs.engine-plan.outputs.runAttempt }}
      SEERRNG_ENGINE_EXECUTION_SHA: ${{ needs.engine-plan.outputs.executionSha }}
      SEERRNG_ENGINE_UNIT_ID: ci-test
    steps:
      - name: Install Git for complete checkout
        run: apk add --no-cache git

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download immutable validation plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: seerrng-engine-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seerrng-engine-plan

      - name: Install native build tools
        run: apk add --no-cache python3 py3-setuptools make g++ gcc libc6-compat

      - name: Pnpm Setup
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Get pnpm store directory
        shell: sh
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-node24-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node24-pnpm-store-

      - name: Install dependencies
        env:
          CI: true
        run: pnpm install

      - name: Admit engine unit
        id: engine-admission
        run: >-
          node bin/run-local-validation.mjs
          --github-admit
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --plan-file "$RUNNER_TEMP/seerrng-engine-plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-receipts"
          --json

      - name: Lint
        if: steps.engine-admission.outputs.execute == 'true'
        run: pnpm lint

      - name: Formatting
        id: formatting
        if: steps.engine-admission.outputs.execute == 'true'
        run: pnpm format:check

      - name: Report exact formatter correction
        if: failure() && steps.formatting.outcome == 'failure'
        run: |
          pnpm format
          git diff --no-ext-diff -- .

      - name: Build
        if: steps.engine-admission.outputs.execute == 'true'
        run: pnpm build

      - name: Bundle budget
        if: steps.engine-admission.outputs.execute == 'true'
        run: pnpm bundle:check

      - name: Seal engine unit receipt
        if: always() && steps.engine-admission.outputs.execute == 'true'
        run: >-
          node bin/run-local-validation.mjs
          --github-receipt
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --plan-file "$RUNNER_TEMP/seerrng-engine-plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-receipts"
          --job-status "${{ job.status }}"
          --json

      - name: Publish engine unit receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seerrng-engine-receipt-${{ github.run_id }}-${{ github.run_attempt }}-ci-test
          path: ${{ runner.temp }}/seerrng-engine-receipts
          if-no-files-found: error
          retention-days: 1

  unit-test:
    name: Unit Tests (${{ matrix.case_id }})
    needs: engine-plan
    timeout-minutes: 75
    if: >-
      always() &&
      !cancelled() &&
      needs.engine-plan.result == 'success' &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.engine-plan.outputs.unitMatrix) }}
    runs-on: ubuntu-latest
    container:
      image: node:24.21.0-alpine3.23@sha256:9ec4a2e289874ed0d722e1772ec2de45d2801541db8612f3638b26f128c69ac2
    env:
      SEERRNG_ENGINE_PLAN_SHA256: ${{ needs.engine-plan.outputs.planSha256 }}
      SEERRNG_ENGINE_RUN_ID: ${{ needs.engine-plan.outputs.runId }}
      SEERRNG_ENGINE_RUN_ATTEMPT: ${{ needs.engine-plan.outputs.runAttempt }}
      SEERRNG_ENGINE_EXECUTION_SHA: ${{ needs.engine-plan.outputs.executionSha }}
      SEERRNG_ENGINE_UNIT_ID: ci-unit-test
      SEERRNG_ENGINE_CASE_ID: ${{ matrix.case_id }}
    steps:
      - name: Install Git for complete checkout
        run: apk add --no-cache git

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download immutable validation plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: seerrng-engine-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seerrng-engine-plan

      - name: Install native build tools
        run: apk add --no-cache python3 py3-setuptools make g++ gcc libc6-compat

      - name: Pnpm Setup
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Get pnpm store directory
        shell: sh
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
          echo "LOCK_HASH=$(sha256sum pnpm-lock.yaml | cut -d ' ' -f 1)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-node24-pnpm-store-${{ env.LOCK_HASH }}
          restore-keys: |
            ${{ runner.os }}-node24-pnpm-store-

      - name: Install dependencies
        env:
          CI: true
        run: pnpm install

      - name: Admit engine unit
        id: engine-admission
        run: >-
          node bin/run-local-validation.mjs
          --github-admit
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --case "$SEERRNG_ENGINE_CASE_ID"
          --plan-file "$RUNNER_TEMP/seerrng-engine-plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-receipts"
          --json

      - name: Materialize planned Vitest shard
        if: steps.engine-admission.outputs.execute == 'true'
        run: >-
          node bin/run-local-validation.mjs
          --github-materialize-test-lane
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --case "$SEERRNG_ENGINE_CASE_ID"
          --lane vitest
          --plan-file "$RUNNER_TEMP/seerrng-engine-plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-receipts"
          --output-file "$RUNNER_TEMP/seerrng-engine-vitest.config.mts"
          --json

      - name: Run tests
        if: steps.engine-admission.outputs.execute == 'true'
        env:
          CI: true
        run: >-
          pnpm test:ci
          --config "$RUNNER_TEMP/seerrng-engine-vitest.config.mts"

      - name: Run engine-owned native Node tests
        if: always() && steps.engine-admission.outputs.execute == 'true'
        env:
          CI: true
        run: >-
          node bin/run-local-validation.mjs
          --github-run-test-lane
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --case "$SEERRNG_ENGINE_CASE_ID"
          --lane node-test-mjs
          --plan-file "$RUNNER_TEMP/seerrng-engine-plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-receipts"
          --report-file "$RUNNER_TEMP/seerrng-engine-node-tests.json"
          --json

      - name: Publish test report
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        if: >-
          (success() || failure()) &&
          steps.engine-admission.outputs.execute == 'true'
        with:
          report_paths: 'report.xml'
          annotate_only: true

      - name: Seal engine unit receipt
        if: always() && steps.engine-admission.outputs.execute == 'true'
        run: >-
          node bin/run-local-validation.mjs
          --github-receipt
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --case "$SEERRNG_ENGINE_CASE_ID"
          --plan-file "$RUNNER_TEMP/seerrng-engine-plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-receipts"
          --job-status "${{ job.status }}"
          --evidence report.xml
          --evidence "$RUNNER_TEMP/seerrng-engine-node-tests.json"
          --json

      - name: Publish engine unit receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seerrng-engine-receipt-${{ github.run_id }}-${{ github.run_attempt }}-ci-unit-test-${{ matrix.case_id }}
          path: ${{ runner.temp }}/seerrng-engine-receipts
          if-no-files-found: error
          retention-days: 1

  codeql:
    name: CodeQL
    needs: engine-plan
    if: >-
      always() &&
      !cancelled() &&
      needs.engine-plan.result == 'success' &&
      needs.engine-plan.outputs.codeql == 'true'
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/codeql.yml
    with:
      plan_sha256: ${{ needs.engine-plan.outputs.planSha256 }}
      engine_run_id: ${{ needs.engine-plan.outputs.runId }}
      engine_run_attempt: ${{ needs.engine-plan.outputs.runAttempt }}
      execution_sha: ${{ needs.engine-plan.outputs.executionSha }}
      unit_id: codeql-analyze

  playwright:
    name: Playwright Tests
    needs: engine-plan
    timeout-minutes: 45
    if: >-
      always() &&
      !cancelled() &&
      needs.engine-plan.result == 'success' &&
      needs.engine-plan.outputs.playwright == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SEERRNG_ENGINE_PLAN_SHA256: ${{ needs.engine-plan.outputs.planSha256 }}
      SEERRNG_ENGINE_RUN_ID: ${{ needs.engine-plan.outputs.runId }}
      SEERRNG_ENGINE_RUN_ATTEMPT: ${{ needs.engine-plan.outputs.runAttempt }}
      SEERRNG_ENGINE_EXECUTION_SHA: ${{ needs.engine-plan.outputs.executionSha }}
      SEERRNG_ENGINE_UNIT_ID: ci-playwright
      PORT: '5055'
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5055
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Pnpm Setup
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Download immutable validation plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: seerrng-engine-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seerrng-engine-plan

      - name: Install dependencies
        env:
          CI: true
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Configure Playwright runtime
        run: |
          printf 'CONFIG_DIRECTORY=%s\n' "$RUNNER_TEMP/seerrng-playwright-runtime-config" >> "$GITHUB_ENV"
          printf 'PLAYWRIGHT_JSON_OUTPUT_FILE=%s\n' "$RUNNER_TEMP/seerrng-engine-playwright-result.json" >> "$GITHUB_ENV"

      - name: Prepare Playwright runtime configuration
        run: pnpm cypress:prepare

      - name: Admit engine unit
        id: engine-admission
        run: >-
          node bin/run-local-validation.mjs
          --github-admit
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --plan-file "$RUNNER_TEMP/seerrng-engine-plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-receipts"
          --json

      - name: Build Playwright application once on Ubuntu
        if: steps.engine-admission.outputs.execute == 'true'
        run: pnpm build

      - name: Run native Playwright suite
        if: steps.engine-admission.outputs.execute == 'true'
        env:
          CI: true
        run: pnpm exec playwright test --reporter=json

      - name: Seal engine unit receipt
        if: always() && steps.engine-admission.outputs.execute == 'true'
        run: >-
          node bin/run-local-validation.mjs
          --github-receipt
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --plan-file "$RUNNER_TEMP/seerrng-engine-plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-receipts"
          --job-status "${{ job.status }}"
          --evidence "$PLAYWRIGHT_JSON_OUTPUT_FILE"
          --json

      - name: Publish engine unit receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seerrng-engine-receipt-${{ github.run_id }}-${{ github.run_attempt }}-ci-playwright
          path: ${{ runner.temp }}/seerrng-engine-receipts
          if-no-files-found: error
          retention-days: 1

  cypress:
    name: Cypress Tests (${{ matrix.case_id }})
    needs: engine-plan
    if: >-
      always() &&
      !cancelled() &&
      needs.engine-plan.result == 'success' &&
      needs.engine-plan.outputs.cypress == 'true'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.engine-plan.outputs.cypressMatrix) }}
    permissions:
      contents: read
    uses: ./.github/workflows/cypress.yml
    with:
      plan_sha256: ${{ needs.engine-plan.outputs.planSha256 }}
      engine_run_id: ${{ needs.engine-plan.outputs.runId }}
      engine_run_attempt: ${{ needs.engine-plan.outputs.runAttempt }}
      execution_sha: ${{ needs.engine-plan.outputs.executionSha }}
      unit_id: cypress-run
      case_id: ${{ matrix.case_id }}
      specs: ${{ matrix.specs }}
    secrets:
      CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}

  test-docs:
    name: Test Docs
    needs: engine-plan
    if: >-
      always() &&
      !cancelled() &&
      needs.engine-plan.result == 'success' &&
      needs.engine-plan.outputs.testDocs == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/test-docs.yml
    with:
      plan_sha256: ${{ needs.engine-plan.outputs.planSha256 }}
      engine_run_id: ${{ needs.engine-plan.outputs.runId }}
      engine_run_attempt: ${{ needs.engine-plan.outputs.runAttempt }}
      execution_sha: ${{ needs.engine-plan.outputs.executionSha }}
      unit_id: test-docs-build

  docs-links:
    name: Check Docs Links
    needs: engine-plan
    if: >-
      always() &&
      !cancelled() &&
      needs.engine-plan.result == 'success' &&
      needs.engine-plan.outputs.docsLinks == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/docs-link-check.yml
    with:
      plan_sha256: ${{ needs.engine-plan.outputs.planSha256 }}
      engine_run_id: ${{ needs.engine-plan.outputs.runId }}
      engine_run_attempt: ${{ needs.engine-plan.outputs.runAttempt }}
      execution_sha: ${{ needs.engine-plan.outputs.executionSha }}
      unit_id: docs-links

  helm:
    name: Lint and Test Charts
    needs: engine-plan
    if: >-
      always() &&
      !cancelled() &&
      needs.engine-plan.result == 'success' &&
      needs.engine-plan.outputs.helm == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/lint-helm-charts.yml
    with:
      plan_sha256: ${{ needs.engine-plan.outputs.planSha256 }}
      engine_run_id: ${{ needs.engine-plan.outputs.runId }}
      engine_run_attempt: ${{ needs.engine-plan.outputs.runAttempt }}
      execution_sha: ${{ needs.engine-plan.outputs.executionSha }}
      unit_id: helm-lint-test

  engine-reconcile:
    name: Native validation engine result
    needs:
      - engine-plan
      - jellyfin-plugin
      - release-notes
      - i18n
      - test
      - unit-test
      - codeql
      - playwright
      - cypress
      - test-docs
      - docs-links
      - helm
    if: >-
      always() &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SEERRNG_ENGINE_PLAN_SHA256: ${{ needs.engine-plan.outputs.planSha256 }}
      SEERRNG_ENGINE_RUN_ID: ${{ needs.engine-plan.outputs.runId }}
      SEERRNG_ENGINE_RUN_ATTEMPT: ${{ needs.engine-plan.outputs.runAttempt }}
      SEERRNG_ENGINE_EXECUTION_SHA: ${{ needs.engine-plan.outputs.executionSha }}
    steps:
      - name: Checkout complete candidate history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          package-manager-cache: false

      - name: Download immutable validation plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: seerrng-engine-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seerrng-engine-plan

      - name: Download current-attempt engine receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: seerrng-engine-receipt-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/seerrng-engine-receipts
          merge-multiple: true

      - name: Reconcile current-run hosted validation results
        env:
          SEERRNG_ENGINE_NEEDS_JSON: ${{ toJSON(needs) }}
          SEERRNG_ENGINE_EXPECTED_PLAN_SHA256: ${{ needs.engine-plan.outputs.planSha256 }}
        run: >-
          node bin/run-local-validation.mjs
          --github-reconcile
          --plan-file "$RUNNER_TEMP/seerrng-engine-plan/hosted-plan.json"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-receipts"
          --json

  preflight-deploy:
    name: Preflight deployment host
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, seerrng, linux-build, kspls0]
    outputs:
      ready: ${{ steps.verify-storage.outputs.ready }}
    permissions:
      contents: read
    env:
      SEERRNG_CONFIG_DIR: ${{ vars.SEERRNG_CONFIG_DIR || '/mnt/datapool_lvm_media/seerrng-config' }}
    steps:
      - name: Verify deployment storage and determine readiness
        id: verify-storage
        shell: bash
        run: |
          set -uo pipefail
          skip_deployment() {
            local reason="$1"
            echo "::warning title=Deployment skipped::$reason"
            echo "$reason" >&2
            printf 'ready=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          }
          test -d "$SEERRNG_CONFIG_DIR" || \
            skip_deployment "Deployment config directory does not exist: $SEERRNG_CONFIG_DIR"
          if ! mount_options="$(findmnt -T "$SEERRNG_CONFIG_DIR" -no OPTIONS 2>/dev/null)"; then
            skip_deployment "Deployment storage mount could not be inspected: $SEERRNG_CONFIG_DIR"
          fi
          echo "Deployment mount options: $mount_options"
          if [[ ",$mount_options," == *,ro,* || ",$mount_options," == *,emergency_ro,* ]]; then
            reason='Deployment storage is read-only; live deployment will remain skipped until the host is repaired.'
            echo "$reason" >&2
            findmnt -T "$SEERRNG_CONFIG_DIR" -o TARGET,SOURCE,FSTYPE,OPTIONS >&2 || true
            df -hT "$SEERRNG_CONFIG_DIR" >&2 || true
            sudo -n lvs -o lv_name,vg_name,lv_attr,lv_size,devices >&2 || true
            skip_deployment "$reason"
          fi
          [[ ",$mount_options," == *,rw,* ]] || \
            skip_deployment "Deployment storage is not mounted read-write: $mount_options"
          if ! used_percent="$(df -P "$SEERRNG_CONFIG_DIR" 2>/dev/null | awk 'NR == 2 { gsub(/%/, "", $5); print $5 }')"; then
            skip_deployment "Deployment storage usage could not be inspected: $SEERRNG_CONFIG_DIR"
          fi
          [[ "$used_percent" =~ ^[0-9]+$ && "$used_percent" -lt 99 ]] || {
            reason="Deployment storage is ${used_percent:-unknown}% full; live deployment will remain skipped."
            echo "$reason" >&2
            df -hT "$SEERRNG_CONFIG_DIR" >&2 || true
            skip_deployment "$reason"
          }
          if ! probe="$(mktemp "$SEERRNG_CONFIG_DIR/.seerrng-ci-write-test.XXXXXX" 2>/dev/null)"; then
            skip_deployment "Deployment storage is not writable: $SEERRNG_CONFIG_DIR"
          fi
          rm -f -- "$probe" || skip_deployment "Deployment storage write-test cleanup failed: $probe"
          printf 'ready=true\n' >> "$GITHUB_OUTPUT"

  publish:
    name: Publish multi-arch image
    timeout-minutes: 90
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: seerrng-main-image-publish
      cancel-in-progress: true
    runs-on:
      [self-hosted, seerrng, linux-build, linux-amd64, linux-arm64-cross]
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_digest: ${{ steps.resolve-digest.outputs.image_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Commit timestamp
        id: ts
        run: echo "TIMESTAMP=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - name: Image channel
        id: channel
        run: echo "CHANNEL=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: network=host

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=${{ steps.channel.outputs.CHANNEL }}
            type=sha
          labels: |
            org.opencontainers.image.created=${{ steps.ts.outputs.TIMESTAMP }}

      - name: Resolve base images with retry
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t base_images < <(
            awk '
              toupper($1) == "FROM" {
                image = ""
                for (i = 2; i <= NF; i++) {
                  if ($i ~ /^--/) {
                    continue
                  }
                  image = $i
                  break
                }
                if (image != "") {
                  images[image] = 1
                }
                for (i = 2; i < NF; i++) {
                  if (toupper($i) == "AS") {
                    aliases[$(i + 1)] = 1
                  }
                }
              }
              END {
                for (image in images) {
                  if (!(image in aliases)) {
                    print image
                  }
                }
              }
            ' Dockerfile | sort -u
          )
          for image in "${base_images[@]}"; do
            for attempt in 1 2 3 4 5; do
              echo "Resolving ${image} (attempt ${attempt}/5)"
              if docker buildx imagetools inspect "$image" >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Unable to resolve ${image} after ${attempt} attempts" >&2
                exit 1
              fi
              sleep $((attempt * 15))
            done
          done

      - name: Build & Push (multi-arch, single tag)
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_LABELS: ${{ steps.meta.outputs.labels }}
          COMMIT_TAG: ${{ github.sha }}
          BUILD_VERSION: ${{ steps.channel.outputs.CHANNEL }}
          SOURCE_DATE_EPOCH: ${{ steps.ts.outputs.TIMESTAMP }}
        run: |
          set -euo pipefail

          build_args=(
            --file ./Dockerfile
            --platform linux/amd64,linux/arm64
            --push
            --build-arg "COMMIT_TAG=${COMMIT_TAG}"
            --build-arg "BUILD_VERSION=${BUILD_VERSION}"
            --build-arg "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}"
            --cache-from type=gha,scope=linux/amd64
            --cache-from type=gha,scope=linux/arm64
            --cache-to type=gha,mode=max
            --provenance mode=max
          )

          while IFS= read -r tag; do
            [ -n "$tag" ] && build_args+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"

          while IFS= read -r label; do
            [ -n "$label" ] && build_args+=(--label "$label")
          done <<< "$IMAGE_LABELS"

          for attempt in 1 2 3; do
            echo "Building and pushing image (attempt ${attempt}/3)"
            if docker buildx build "${build_args[@]}" .; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Image build/push failed after ${attempt} attempts" >&2
              exit 1
            fi
            sleep $((attempt * 30))
          done

      - name: Verify published architectures
        shell: bash
        run: |
          set -euo pipefail
          image_name="${GHCR_IMAGE}"
          scripts/verify-container-manifest.sh --require-provenance "${image_name}:main" linux/amd64 linux/arm64
          scripts/verify-container-manifest.sh --require-provenance "${image_name}:sha-${GITHUB_SHA::7}" linux/amd64 linux/arm64

      - name: Resolve published image digest
        id: resolve-digest
        shell: bash
        run: |
          set -euo pipefail
          image_name="${GHCR_IMAGE}"
          for attempt in 1 2 3 4 5; do
            echo "Resolving published image digest (attempt ${attempt}/5)"
            if digest=$(docker buildx imagetools inspect "${image_name}:main" --format '{{json .Manifest.Digest}}' | tr -d '"') &&
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "image_digest=$digest" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo 'Unable to resolve the published image digest after 5 attempts.' >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done

  scan-main-image:
    name: Scan main image (${{ matrix.platform }})
    if: github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      TRIVY_CACHE_DIR: .trivycache
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Trivy DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .trivycache
          key: trivy-${{ runner.os }}-${{ hashFiles('**/Dockerfile') }}
          restore-keys: |
            trivy-${{ runner.os }}-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      - name: Run Trivy image scan
        env:
          PLATFORM: ${{ matrix.platform }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
        run: |
          trivy image \
            --platform "$PLATFORM" \
            --format sarif \
            --output "trivy-main-${{ matrix.suffix }}.sarif" \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            "${GHCR_IMAGE}@${IMAGE_DIGEST}"

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-main-${{ matrix.suffix }}.sarif
          category: trivy-main-${{ matrix.suffix }}

  deploy-main:
    name: Deploy main to seerr.home
    timeout-minutes: 30
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.preflight-deploy.outputs.ready == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.deploy_main)
    needs: [publish, preflight-deploy]
    concurrency:
      group: seerrng-live-deploy
      cancel-in-progress: false
    runs-on: [self-hosted, seerrng, linux-build, kspls0]
    permissions:
      contents: read
      packages: read
    env:
      SEERRNG_CONTAINER_NAME: ${{ vars.SEERRNG_CONTAINER_NAME || 'seerr-host' }}
      SEERRNG_PORT: ${{ vars.SEERRNG_PORT || '5055' }}
      SEERRNG_CONFIG_DIR: ${{ vars.SEERRNG_CONFIG_DIR || '/mnt/datapool_lvm_media/seerrng-config' }}
      SEERRNG_IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: network=host

      - name: Log in to GitHub Container Registry on seerr.home
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username '${{ github.repository_owner }}' --password-stdin

      - name: Pull latest main image
        run: |
          set -euo pipefail
          image_name="${GHCR_IMAGE}"
          digest="${SEERRNG_IMAGE_DIGEST:?The publish job did not provide an image digest}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo 'The publish job returned an invalid image digest.' >&2
            exit 1
          }
          image_ref="${image_name}@${digest}"
          docker pull "$image_ref"
          printf 'SEERRNG_IMAGE_REF=%s\n' "$image_ref" >> "$GITHUB_ENV"

      - name: Validate deployment inputs
        run: |
          set -euo pipefail
          if [[ ! "$SEERRNG_CONTAINER_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,110}$ ]]; then
            echo 'Invalid deployment container name.' >&2
            exit 1
          fi
          if [[ ! "$SEERRNG_PORT" =~ ^[0-9]{1,5}$ ]] ||
             (( 10#$SEERRNG_PORT < 1 || 10#$SEERRNG_PORT > 65535 )); then
            echo 'Invalid deployment port.' >&2
            exit 1
          fi
          if [[ "$SEERRNG_CONFIG_DIR" != /* ||
                "$SEERRNG_CONFIG_DIR" == *:* ||
                "$SEERRNG_CONFIG_DIR" =~ [[:cntrl:]] ||
                ${#SEERRNG_CONFIG_DIR} -gt 4096 ]]; then
            echo 'Invalid deployment config directory.' >&2
            exit 1
          fi

      - name: Prepare config directory
        run: |
          docker run --rm --user 0 \
            --entrypoint sh \
            -v "$SEERRNG_CONFIG_DIR:/config" \
            "$SEERRNG_IMAGE_REF" \
            -c 'chown 1000:1000 /config && chmod 0755 /config'

      - name: Deploy seerr.home
        id: deploy-main
        run: |
          set -euo pipefail
          external_config_file="$(mktemp)"
          external_env_file="$(mktemp)"
          external_config_args=()
          trap 'rm -f "$external_config_file" "$external_env_file"' EXIT
          if [[ -f "$SEERRNG_CONFIG_DIR/settings.json" ]]; then
            docker run --rm \
              --user 1000:1000 \
              --entrypoint node \
              -v "$SEERRNG_CONFIG_DIR:/config:ro" \
              "$SEERRNG_IMAGE_REF" \
              /app/scripts/export-external-config.mjs /config/settings.json \
              > "$external_config_file"
            printf 'SEERR_EXTERNAL_CONFIG=%s\n' "$(cat "$external_config_file")" \
              > "$external_env_file"
            external_config_args=(--env-file "$external_env_file")
          else
            echo 'No settings.json found; starting SeerrNG so it can initialize the config.'
          fi
          if [[ ! "$SEERRNG_CONTAINER_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,110}$ ]]; then
            echo 'Invalid deployment container name.' >&2
            exit 1
          fi
          rollback_container="${SEERRNG_CONTAINER_NAME}-rollback"
          echo 'cutover_started=true' >> "$GITHUB_OUTPUT"
          if docker inspect "$rollback_container" >/dev/null 2>&1; then
            # A prior runner interruption left a known-good rollback. Preserve
            # it and discard only the unverified current generation.
            docker rm -f "$SEERRNG_CONTAINER_NAME" 2>/dev/null || true
          elif docker inspect "$SEERRNG_CONTAINER_NAME" >/dev/null 2>&1; then
            docker stop --time 30 "$SEERRNG_CONTAINER_NAME"
            docker rename "$SEERRNG_CONTAINER_NAME" "$rollback_container"
          fi
          docker run -d \
            --name "$SEERRNG_CONTAINER_NAME" \
            --restart unless-stopped \
            --init \
            --user 1000:1000 \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=1777 \
            --tmpfs /app/.next/cache:rw,noexec,nosuid,nodev,size=256m,uid=1000,gid=1000,mode=0700 \
            --health-cmd "node /app/scripts/healthcheck.mjs" \
            --health-interval 10s \
            --health-timeout 5s \
            --health-retries 12 \
            --health-start-period 20s \
            --network host \
            "${external_config_args[@]}" \
            -e TZ="${TZ:-America/Regina}" \
            -e PORT="$SEERRNG_PORT" \
            -e CONFIG_DIRECTORY=/app/config \
            -e LOG_LEVEL="${LOG_LEVEL:-info}" \
            -v "$SEERRNG_CONFIG_DIR:/app/config" \
            "$SEERRNG_IMAGE_REF"

      - name: Verify seerr.home deployment
        run: |
          set -euo pipefail
          status_file="$RUNNER_TEMP/seerr-main-status.json"
          rm -f "$status_file"
          docker ps --filter "name=^/${SEERRNG_CONTAINER_NAME}$" --filter "status=running" --format '{{.Names}}' | grep -qx "$SEERRNG_CONTAINER_NAME"
          status_ready=false
          for i in $(seq 1 90); do
            if docker exec "$SEERRNG_CONTAINER_NAME" node -e \
              "const port = process.argv[1]; fetch('http://127.0.0.1:' + port + '/api/v1/status').then(async response => { if (!response.ok) process.exit(1); process.stdout.write(await response.text()); }).catch(() => process.exit(1))" \
              "$SEERRNG_PORT" \
              > "$status_file"; then
              status_ready=true
              cat "$status_file"
              break
            fi
            sleep 2
          done
          test "$status_ready" = true
          short_sha="${GITHUB_SHA::8}"
          grep -Eq "\"commitTag\":\"(${GITHUB_SHA}|${short_sha})\"" "$status_file"

      - name: Remove verified rollback container
        if: success()
        run: docker rm -f "${SEERRNG_CONTAINER_NAME}-rollback" 2>/dev/null || true

      - name: Restore previous seerr.home deployment
        if: (failure() || cancelled()) && steps.deploy-main.outputs.cutover_started == 'true'
        run: |
          set -euo pipefail
          rollback_container="${SEERRNG_CONTAINER_NAME}-rollback"
          if docker inspect "$rollback_container" >/dev/null 2>&1; then
            docker rm -f "$SEERRNG_CONTAINER_NAME" 2>/dev/null || true
            docker rename "$rollback_container" "$SEERRNG_CONTAINER_NAME"
            docker start "$SEERRNG_CONTAINER_NAME"
          elif docker inspect "$SEERRNG_CONTAINER_NAME" >/dev/null 2>&1; then
            # Cancellation can land after stop but before rename.
            docker start "$SEERRNG_CONTAINER_NAME" >/dev/null
          else
            echo 'No previous deployment was available to restore.' >&2
          fi
