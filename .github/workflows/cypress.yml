---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Cypress Tests
# Keep the E2E workflow path-sensitive while allowing explicit test-transport fixes to rerun it.

on:
  workflow_call:
    inputs:
      plan_sha256:
        required: true
        type: string
      engine_run_id:
        required: true
        type: string
      engine_run_attempt:
        required: true
        type: string
      execution_sha:
        required: true
        type: string
      unit_id:
        required: true
        type: string
      case_id:
        required: true
        type: string
      specs:
        required: true
        type: string
    secrets:
      CYPRESS_RECORD_KEY:
        required: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cypress-${{ github.event.pull_request.number || github.ref }}-${{ inputs.case_id || 'standalone' }}
  cancel-in-progress: true

jobs:
  cypress-run:
    name: Cypress Run (${{ inputs.case_id || 'standalone' }})
    timeout-minutes: 45
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SEERRNG_ENGINE_PLAN_SHA256: ${{ inputs.plan_sha256 }}
      SEERRNG_ENGINE_RUN_ID: ${{ inputs.engine_run_id }}
      SEERRNG_ENGINE_RUN_ATTEMPT: ${{ inputs.engine_run_attempt }}
      SEERRNG_ENGINE_EXECUTION_SHA: ${{ inputs.execution_sha }}
      SEERRNG_ENGINE_UNIT_ID: ${{ inputs.unit_id }}
      SEERRNG_ENGINE_CASE_ID: ${{ inputs.case_id }}
      SEERRNG_ENGINE_CYPRESS_FILES: ${{ inputs.specs }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Pnpm Setup
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Download immutable validation plan
        if: inputs.plan_sha256 != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: seerrng-engine-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seerrng-engine-plan

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup cypress cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-cypress-store-

      - name: Install Cypress binary
        env:
          CYPRESS_CACHE_FOLDER: ~/.cache/Cypress
        run: pnpm exec cypress install

      - name: Configure Cypress runtime directory
        run: printf 'CONFIG_DIRECTORY=%s\n' "$RUNNER_TEMP/seerrng-cypress-runtime-config" >> "$GITHUB_ENV"

      - name: Configure Cypress engine result
        if: inputs.plan_sha256 != ''
        run: printf 'SEERRNG_ENGINE_CYPRESS_REPORT=%s\n' "$RUNNER_TEMP/seerrng-engine-cypress-result.json" >> "$GITHUB_ENV"

      - name: Prepare Cypress runtime configuration
        run: pnpm cypress:prepare

      - name: Export external runtime configuration
        id: export-config
        run: |
          printf 'external_config=%s\n' "$(node scripts/export-external-config.mjs "$CONFIG_DIRECTORY/settings.json")" >> "$GITHUB_OUTPUT"

      - name: Admit engine unit
        id: engine-admission
        if: inputs.plan_sha256 != ''
        run: >-
          node bin/run-local-validation.mjs
          --github-admit
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --case "$SEERRNG_ENGINE_CASE_ID"
          --plan-file "$RUNNER_TEMP/seerrng-engine-plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-receipts"
          --json

      - name: Build Cypress application once on Ubuntu
        if: >-
          inputs.plan_sha256 == '' ||
          steps.engine-admission.outputs.execute == 'true'
        env:
          SEERR_EXTERNAL_CONFIG: ${{ steps.export-config.outputs.external_config }}
          WITH_MIGRATIONS: true
          E2E_TESTS: true
          PORT: 5056
        run: pnpm cypress:build

      - name: Cypress run
        if: >-
          inputs.plan_sha256 == '' ||
          steps.engine-admission.outputs.execute == 'true'
        uses: cypress-io/github-action@789d836053c5ca389c2905fc0c9f2909da778c46 # v7.4.5
        with:
          install: false
          start: env E2E_TESTS=true pnpm start
          wait-on: 'http://localhost:5056'
          config: baseUrl=http://localhost:5056
          spec: ${{ inputs.specs }}
          # Forks and installations without a Cypress Dashboard key must still
          # run the suite instead of failing before the first spec starts.
          record: ${{ github.event_name == 'push' && secrets.CYPRESS_RECORD_KEY != '' }}
          group: ${{ github.event_name == 'push' && secrets.CYPRESS_RECORD_KEY != '' && inputs.case_id || '' }}
          ci-build-id: ${{ github.event_name == 'push' && secrets.CYPRESS_RECORD_KEY != '' && format('{0}-{1}', github.run_id, github.run_attempt) || '' }}
        env:
          SEERR_EXTERNAL_CONFIG: ${{ steps.export-config.outputs.external_config }}
          CYPRESS_RECORD_KEY: ${{ github.event_name == 'push' && secrets.CYPRESS_RECORD_KEY || '' }}
          GITHUB_TOKEN: ${{ github.event_name == 'push' && secrets.GITHUB_TOKEN || '' }}
          WITH_MIGRATIONS: true
          E2E_TESTS: true
          PORT: 5056
          # Fix test titles in cypress dashboard
          COMMIT_INFO_MESSAGE: ${{ github.event_name == 'pull_request' && github.event.pull_request.title || github.event.head_commit.message }}
          COMMIT_INFO_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Seal engine unit receipt
        if: >-
          always() &&
          inputs.plan_sha256 != '' &&
          steps.engine-admission.outputs.execute == 'true'
        run: >-
          node bin/run-local-validation.mjs
          --github-receipt
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --case "$SEERRNG_ENGINE_CASE_ID"
          --plan-file "$RUNNER_TEMP/seerrng-engine-plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-receipts"
          --job-status "${{ job.status }}"
          --evidence "$SEERRNG_ENGINE_CYPRESS_REPORT"
          --json

      - name: Publish engine unit receipt
        if: always() && inputs.plan_sha256 != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seerrng-engine-receipt-${{ github.run_id }}-${{ github.run_attempt }}-cypress-run-${{ inputs.case_id }}
          path: ${{ runner.temp }}/seerrng-engine-receipts
          if-no-files-found: error
          retention-days: 1
