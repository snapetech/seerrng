---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Cypress Tests
# Keep the E2E workflow path-sensitive while allowing explicit test-transport fixes to rerun it.

on:
  pull_request:
    branches: ['*']
    paths:
      - '{src,server,config,cypress}/**'
      - 'scripts/export-external-config.mjs'
      - 'cypress.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'next.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/cypress.yml'
  push:
    branches: [main]
    paths:
      - '{src,server,config,cypress}/**'
      - 'scripts/export-external-config.mjs'
      - 'cypress.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'next.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/cypress.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cypress-run:
    name: Cypress Run
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Pnpm Setup
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup cypress cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-cypress-store-

      - name: Install Cypress binary
        env:
          CYPRESS_CACHE_FOLDER: ~/.cache/Cypress
        run: pnpm exec cypress install

      - name: Prepare Cypress runtime configuration
        env:
          CONFIG_DIRECTORY: cypress/runtime-config
        run: pnpm cypress:prepare

      - name: Export external runtime configuration
        id: export-config
        run: |
          printf 'external_config=%s\n' "$(node scripts/export-external-config.mjs "$CONFIG_DIRECTORY/settings.json")" >> "$GITHUB_OUTPUT"
        env:
          CONFIG_DIRECTORY: cypress/runtime-config

      - name: Cypress run
        uses: cypress-io/github-action@fa4a118725a8f001170d49631ea89e5d66fee626 # v7.4.1
        with:
          install: false
          build: pnpm cypress:build
          start: env E2E_TESTS=true pnpm start
          wait-on: 'http://localhost:5056'
          config: baseUrl=http://localhost:5056
          # Forks and installations without a Cypress Dashboard key must still
          # run the suite instead of failing before the first spec starts.
          record: ${{ github.event_name == 'push' && secrets.CYPRESS_RECORD_KEY != '' }}
        env:
          SEERR_EXTERNAL_CONFIG: ${{ steps.export-config.outputs.external_config }}
          CYPRESS_RECORD_KEY: ${{ github.event_name == 'push' && secrets.CYPRESS_RECORD_KEY || '' }}
          GITHUB_TOKEN: ${{ github.event_name == 'push' && secrets.GITHUB_TOKEN || '' }}
          WITH_MIGRATIONS: true
          E2E_TESTS: true
          CONFIG_DIRECTORY: cypress/runtime-config
          PORT: 5056
          # Fix test titles in cypress dashboard
          COMMIT_INFO_MESSAGE: ${{ github.event_name == 'pull_request' && github.event.pull_request.title || github.event.head_commit.message }}
          COMMIT_INFO_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
