---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Publish CodeQL Model Pack

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: read

jobs:
  validate-main-ref:
    name: Validate main ref
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Confirm main ref
        run: test "$GITHUB_REF" = 'refs/heads/main'

  publish:
    runs-on: ubuntu-latest
    needs: validate-main-ref
    if: needs.validate-main-ref.result == 'success'
    permissions:
      contents: read
      packages: write
      security-events: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up CodeQL CLI
        id: setup-codeql
        uses: github/codeql-action/setup-codeql@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1

      - name: Publish model pack
        env:
          CODEQL: ${{ steps.setup-codeql.outputs.codeql-path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | "$CODEQL" pack publish \
            --github-auth-stdin \
            .github/codeql/model-pack
