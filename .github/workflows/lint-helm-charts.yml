---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Lint and Test Charts

on:
  workflow_call:
    inputs:
      plan_sha256:
        required: true
        type: string
      engine_run_id:
        required: true
        type: string
      engine_run_attempt:
        required: true
        type: string
      execution_sha:
        required: true
        type: string
      unit_id:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: helm-charts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SEERRNG_ENGINE_PLAN_SHA256: ${{ inputs.plan_sha256 }}
      SEERRNG_ENGINE_RUN_ID: ${{ inputs.engine_run_id }}
      SEERRNG_ENGINE_RUN_ATTEMPT: ${{ inputs.engine_run_attempt }}
      SEERRNG_ENGINE_EXECUTION_SHA: ${{ inputs.execution_sha }}
      SEERRNG_ENGINE_UNIT_ID: ${{ inputs.unit_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js for engine binding
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          package-manager-cache: false

      - name: Download immutable validation plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: seerrng-engine-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seerrng-engine-plan

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Admit engine unit
        id: engine-admission
        run: >-
          node bin/run-local-validation.mjs
          --github-admit
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --plan-file "$RUNNER_TEMP/seerrng-engine-plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-receipts"
          --json

      - name: Run chart-testing (list-changed)
        id: list-changed
        if: steps.engine-admission.outputs.execute == 'true'
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          charts_file="$RUNNER_TEMP/seerrng-helm-charts.txt"
          : > "$charts_file"

          if [[ "$GITHUB_EVENT_NAME" != 'pull_request' ]]; then
            exit 0
          fi

          changed=$(ct list-changed --target-branch "$TARGET_BRANCH")
          if [[ -n "$changed" ]]; then
            printf '%s\n' "$changed" | tee "$charts_file"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure documentation is updated
        if: >-
          !cancelled() &&
          steps.engine-admission.outputs.execute == 'true' &&
          (github.event_name == 'push' ||
          steps.list-changed.outputs.changed == 'true')
        env:
          HELM_DOCS_IMAGE: jnorwood/helm-docs:v1.14.2@sha256:7e562b49ab6b1dbc50c3da8f2dd6ffa8a5c6bba327b1c6335cc15ce29267979c
        run: |
          set -euo pipefail
          charts_file="$RUNNER_TEMP/seerrng-helm-charts.txt"

          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            find charts -type f -name Chart.yaml -printf '%h\n' \
              | sort -u > "$charts_file"
          fi

          while IFS= read -r chart; do
            [[ -n "$chart" ]] || continue
            case "$chart" in
              charts/*) ;;
              *)
                echo "Unexpected chart path: $chart" >&2
                exit 1
                ;;
            esac

            generated=$(mktemp "$RUNNER_TEMP/helm-docs.XXXXXX")
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              --volume "$GITHUB_WORKSPACE:/helm-docs:ro" \
              "$HELM_DOCS_IMAGE" \
              --chart-search-root "$chart" \
              --dry-run > "$generated"
            diff --unified "$chart/README.md" "$generated"
          done < "$charts_file"

      - name: Run chart-testing (pull request)
        if: >-
          !cancelled() &&
          steps.engine-admission.outputs.execute == 'true' &&
          github.event_name == 'pull_request' &&
          steps.list-changed.outputs.changed == 'true'
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: ct lint --target-branch "$TARGET_BRANCH" --validate-maintainers=false

      - name: Run chart-testing (push)
        if: >-
          !cancelled() &&
          steps.engine-admission.outputs.execute == 'true' &&
          github.event_name == 'push'
        run: ct lint --all --validate-maintainers=false

      - name: Seal engine unit receipt
        if: always() && steps.engine-admission.outputs.execute == 'true'
        run: >-
          node bin/run-local-validation.mjs
          --github-receipt
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --plan-file "$RUNNER_TEMP/seerrng-engine-plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-receipts"
          --job-status "${{ job.status }}"
          --json

      - name: Publish engine unit receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seerrng-engine-receipt-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.unit_id }}
          path: ${{ runner.temp }}/seerrng-engine-receipts
          if-no-files-found: error
          retention-days: 1
