---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: SeerrNG Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish or retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_HUB: snapetech/seerrng
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate-main-tag:
    name: Validate main release tag
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Ensure tag is on main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'push' && "$GITHUB_REF_TYPE" != 'tag' ]]; then
            echo 'Release pushes must originate from a tag.' >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9][0-9A-Za-z._+-]{0,126}$ ]]; then
            echo 'Invalid release tag.' >&2
            exit 1
          fi
          git fetch --no-tags origin main
          release_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$release_sha" origin/main; then
            echo "::error::Release tags must point at commits contained in origin/main."
            exit 1
          fi

  changelog:
    name: Generate changelog
    needs: validate-main-tag
    timeout-minutes: 10
    runs-on: [self-hosted, Linux, X64, seerrng]
    permissions:
      contents: read
    outputs:
      release_body: ${{ steps.release-body.outputs.release_body }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          package-manager-cache: false

      - name: Generate changelog
        id: git-cliff
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: .github/cliff.toml
          args: -vv --current
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Add curated release notes
        shell: bash
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          previous_tag="$(git describe --tags --match 'v[0-9]*' --abbrev=0 "${release_sha}^")"
          node scripts/assemble-release-notes.mjs \
            --previous-tag "$previous_tag" \
            --head "$release_sha" \
            --changelog CHANGELOG.md \
            --output CHANGELOG.md

          if ! grep -Eq '^[[:space:]]*-[[:space:]]+' CHANGELOG.md; then
            echo 'Generated release notes contain no changelog entries.' >&2
            exit 1
          fi

      - name: Export release body
        id: release-body
        shell: bash
        run: |
          set -euo pipefail
          delimiter="release_body_${GITHUB_RUN_ID}"
          {
            echo "release_body<<${delimiter}"
            cat CHANGELOG.md
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  create-draft-release:
    name: Create draft release
    timeout-minutes: 10
    runs-on: [self-hosted, Linux, X64, seerrng]
    permissions:
      contents: write
    needs: changelog
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Draft Release
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'Release %s.\n\n' "$RELEASE_TAG"
            printf '%s\n\n' "$RELEASE_BODY"
            printf '%s\n' 'Container images are published by this release pipeline; binary assets and package channels follow after asset generation.'
          } > release-notes.md
          test -s release-notes.md
          gh release create "${RELEASE_TAG}" \
            -t "Release ${RELEASE_TAG}" \
            -F release-notes.md \
            --draft || gh release edit "${RELEASE_TAG}" \
            -t "Release ${RELEASE_TAG}" \
            -F release-notes.md \
            --draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: ${{ needs.changelog.outputs.release_body }}

  publish:
    name: Publish multi-arch manifests
    needs: [validate-main-tag, create-draft-release]
    timeout-minutes: 90
    runs-on: [self-hosted, Linux, X64, seerrng]
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.digests.outputs.IMAGE_DIGEST }}
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Commit timestamp
        id: ts
        run: echo "TIMESTAMP=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          driver-opts: network=host

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.DOCKER_HUB }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{raw}},value=${{ env.VERSION }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ env.VERSION }}
            type=semver,pattern=v{{major}},value=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.created=${{ steps.ts.outputs.TIMESTAMP }}

      - name: Build & Push (multi-arch)
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"

          build_args=(
            --file ./Dockerfile
            --platform linux/amd64,linux/arm64
            --push
            --build-arg "COMMIT_TAG=${release_sha}"
            --build-arg "BUILD_VERSION=${{ env.VERSION }}"
            --build-arg "SOURCE_DATE_EPOCH=${{ steps.ts.outputs.TIMESTAMP }}"
            --cache-from type=gha,scope=linux/amd64
            --cache-from type=gha,scope=linux/arm64
            --cache-to type=gha,mode=max
            --provenance mode=max
          )

          while IFS= read -r tag; do
            [ -n "$tag" ] && build_args+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"

          while IFS= read -r label; do
            [ -n "$label" ] && build_args+=(--label "$label")
          done <<< "$IMAGE_LABELS"

          for attempt in 1 2 3 4 5; do
            echo "Building and pushing release image (attempt ${attempt}/5)"
            if docker buildx build "${build_args[@]}" .; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Release image build/push failed after ${attempt} attempts" >&2
              exit 1
            fi
            sleep $((attempt * 30))
          done

      - name: Resolve manifest digest
        id: digests
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Resolving release manifest digest (attempt ${attempt}/5)"
            if DIGEST=$(docker buildx imagetools inspect "${{ env.DOCKER_HUB }}:${{ env.VERSION }}" --format '{{json .Manifest.Digest}}' | tr -d '"') &&
              [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo 'Unable to resolve the release manifest digest after 5 attempts.' >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Also tag :latest (non-pre-release only)
        shell: bash
        if: ${{ !contains(env.VERSION, '-') }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Tagging release images as latest (attempt ${attempt}/5)"
            if docker buildx imagetools create \
                -t "${{ env.DOCKER_HUB }}:latest" \
                "${{ env.DOCKER_HUB }}:${{ env.VERSION }}" &&
              docker buildx imagetools create \
                -t "ghcr.io/${{ github.repository }}:latest" \
                "ghcr.io/${{ github.repository }}:${{ env.VERSION }}"; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo 'Unable to tag release images as latest after 5 attempts.' >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Verify published architectures
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -euo pipefail
          scripts/verify-container-manifest.sh --require-provenance "${DOCKER_HUB}:${VERSION}" linux/amd64 linux/arm64
          scripts/verify-container-manifest.sh --require-provenance "ghcr.io/${GITHUB_REPOSITORY}:${VERSION}" linux/amd64 linux/arm64
          if [[ "$VERSION" != *-* ]]; then
            scripts/verify-container-manifest.sh --require-provenance "${DOCKER_HUB}:latest" linux/amd64 linux/arm64
            scripts/verify-container-manifest.sh --require-provenance "ghcr.io/${GITHUB_REPOSITORY}:latest" linux/amd64 linux/arm64
          fi

  sign:
    name: Sign images and create SBOM attestations
    needs: publish
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
      COSIGN_YES: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign images
        run: |
          cosign sign --recursive "ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.image_digest }}"
          cosign sign --recursive "${{ env.DOCKER_HUB }}@${{ needs.publish.outputs.image_digest }}"

      - name: Resolve published platform digests
        run: |
          set -euo pipefail
          resolve_platforms() {
            docker buildx imagetools inspect --raw "$1" |
              jq -r '
                .manifests[]
                | select(.platform.os == "linux")
                | select(.platform.architecture == "amd64" or .platform.architecture == "arm64")
                | [.platform.architecture, .digest]
                | @tsv
              ' | sort
          }
          mapfile -t ghcr_platforms < <(
            resolve_platforms "ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.image_digest }}"
          )
          mapfile -t dockerhub_platforms < <(
            resolve_platforms "${{ env.DOCKER_HUB }}@${{ needs.publish.outputs.image_digest }}"
          )
          [[ "${#ghcr_platforms[@]}" -eq 2 ]] || exit 1
          [[ "${#dockerhub_platforms[@]}" -eq 2 ]] || exit 1
          diff -u <(printf '%s\n' "${ghcr_platforms[@]}") <(printf '%s\n' "${dockerhub_platforms[@]}")
          printf '%s\n' "${ghcr_platforms[@]}" | grep -Eq '^amd64\tsha256:[0-9a-f]{64}$'
          printf '%s\n' "${ghcr_platforms[@]}" | grep -Eq '^arm64\tsha256:[0-9a-f]{64}$'
          printf '%s\n' "${ghcr_platforms[@]}" > "$RUNNER_TEMP/seerrng-platform-digests"

      - name: Generate and attest per-platform SBOMs
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r arch digest; do
            ghcr_sbom="seerr-ghcr-${arch}-${{ env.VERSION }}.sbom"
            dockerhub_sbom="seerr-dockerhub-${arch}-${{ env.VERSION }}.sbom"
            trivy image --platform "linux/$arch" --timeout 15m --format cyclonedx \
              --output "$ghcr_sbom" \
              "ghcr.io/${{ github.repository }}@$digest"
            trivy image --platform "linux/$arch" --timeout 15m --format cyclonedx \
              --output "$dockerhub_sbom" \
              "${{ env.DOCKER_HUB }}@$digest"
            cosign attest \
              --type cyclonedx \
              --predicate "$ghcr_sbom" \
              "ghcr.io/${{ github.repository }}@$digest"
            cosign attest \
              --type cyclonedx \
              --predicate "$dockerhub_sbom" \
              "${{ env.DOCKER_HUB }}@$digest"
          done < "$RUNNER_TEMP/seerrng-platform-digests"

      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sboms-${{ env.VERSION }}
          path: '*.sbom'
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Verify signatures and attestations
    needs: [publish, sign]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify signatures
        run: |
          cosign verify "ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.image_digest }}" \
            --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

          cosign verify "${{ env.DOCKER_HUB }}@${{ needs.publish.outputs.image_digest }}" \
            --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Verify per-platform SBOM attestations
        run: |
          set -euo pipefail
          resolve_platforms() {
            docker buildx imagetools inspect --raw "$1" |
              jq -r '
                .manifests[]
                | select(.platform.os == "linux")
                | select(.platform.architecture == "amd64" or .platform.architecture == "arm64")
                | [.platform.architecture, .digest]
                | @tsv
              ' | sort
          }
          for registry_image in \
            "ghcr.io/${{ github.repository }}" \
            "${{ env.DOCKER_HUB }}"; do
            mapfile -t platforms < <(
              resolve_platforms "$registry_image@${{ needs.publish.outputs.image_digest }}"
            )
            [[ "${#platforms[@]}" -eq 2 ]] || exit 1
            printf '%s\n' "${platforms[@]}" | grep -Eq '^amd64\tsha256:[0-9a-f]{64}$'
            printf '%s\n' "${platforms[@]}" | grep -Eq '^arm64\tsha256:[0-9a-f]{64}$'
            while IFS=$'\t' read -r arch digest; do
              timeout 5m cosign verify-attestation \
                --type cyclonedx \
                --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
                --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$registry_image@$digest" > /dev/null
            done < <(printf '%s\n' "${platforms[@]}")
          done

  publish-release:
    name: Publish release
    needs:
      [create-draft-release, verify, build-release-assets, dispatch-package-channels]
    timeout-minutes: 10
    runs-on: [self-hosted, Linux, X64, seerrng]
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Publish release
        run: gh release edit "${{ env.VERSION }}" --draft=false --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-release-assets:
    name: Build release assets
    needs: verify
    uses: ./.github/workflows/release-assets.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: write

  dispatch-package-channels:
    name: Dispatch package channels
    needs: [verify, build-release-assets]
    timeout-minutes: 120
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch package workflows
        env:
          GH_TOKEN: ${{ secrets.GH_WORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$TAG" == *-* ]]; then
            echo "Skipping stable package channels for pre-release tag $TAG."
            exit 0
          fi
          for workflow in \
            release-linux-packages.yml \
            release-flatpak.yml \
            release-aur.yml \
            release-snap.yml \
            release-ppa.yml \
            release-copr.yml
          do
            dispatch_started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh workflow run "$workflow" --repo "$REPO" --ref main -f "tag=$TAG"
            run_id=""
            for attempt in {1..60}; do
              runs_json="$(gh api "repos/$REPO/actions/workflows/$workflow/runs?event=workflow_dispatch&branch=main&per_page=20")"
              run_id="$(jq -r --arg started "$dispatch_started" '
                [.workflow_runs[]
                  | select(.created_at >= $started and .head_branch == "main")
                  | .id]
                | first // empty
              ' <<<"$runs_json")"
              if [[ -n "$run_id" ]]; then
                break
              fi
              sleep 5
            done
            [[ -n "$run_id" ]] || {
              echo "Unable to find the dispatched $workflow run." >&2
              exit 1
            }
            echo "Waiting for $workflow run $run_id"
            gh run watch "$run_id" --repo "$REPO" --interval 15 --exit-status
          done

      - name: Verify release package assets
        env:
          GH_TOKEN: ${{ secrets.GH_WORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$TAG" == *-* ]]; then
            echo "Stable package assets are not required for pre-release tag $TAG."
            exit 0
          fi
          version="${TAG#v}"
          for attempt in {1..20}; do
            assets="$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[].name' 2>/dev/null || true)"
            required=(
              "seerrng-${TAG}-linux-x64.tar.gz"
              "seerrng-${TAG}-linux-x64.tar.gz.sha256"
              "seerrng-${TAG}-linux-arm64.tar.gz"
              "seerrng-${TAG}-linux-arm64.tar.gz.sha256"
              "seerrng-${TAG}-macos-arm64.tar.gz"
              "seerrng-${TAG}-macos-arm64.tar.gz.sha256"
              "seerrng-${TAG}-windows-x64.zip"
              "seerrng-${TAG}-windows-x64.zip.sha256"
              "seerrng_${version}_amd64.deb"
              "seerrng_${version}_amd64.deb.sha256"
              "SeerrNG-${version}-x86_64.AppImage"
              "SeerrNG-${version}-x86_64.AppImage.sha256"
              "SeerrNG-${version}-x86_64.flatpak"
              "SeerrNG-${version}-x86_64.flatpak.sha256"
            )
            missing=()
            for asset in "${required[@]}"; do
              grep -Fxq "$asset" <<<"$assets" || missing+=("$asset")
            done
            if ! grep -Eq "^seerrng-${version}-.*\\.rpm$" <<<"$assets" ||
              ! grep -Eq "^seerrng-${version}-.*\\.rpm\\.sha256$" <<<"$assets"; then
              missing+=("RPM and checksum sidecars")
            fi
            if [[ "${#missing[@]}" -eq 0 ]]; then
              echo "Verified release asset inventory for $TAG."
              exit 0
            fi
            printf 'Waiting for release assets (%s/20); missing: %s\n' "$attempt" "${missing[*]}"
            sleep 15
          done
          echo "Release asset inventory is incomplete for $TAG." >&2
          exit 1

  announce-discord:
    name: Announce release to Discord
    needs: [changelog, publish, publish-release, dispatch-package-channels]
    timeout-minutes: 10
    runs-on: [self-hosted, Linux, X64, seerrng]
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
      IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
      RELEASE_BODY: ${{ needs.changelog.outputs.release_body }}
    steps:
      - name: Send Discord announcement
        shell: bash
        run: |
          test -n "$DISCORD_WEBHOOK" || {
            echo 'DISCORD_RELEASE_WEBHOOK is required to complete a release.' >&2
            exit 1
          }
          release_url="${{ github.server_url }}/${{ github.repository }}/releases/tag/${VERSION}"
          image_ref="ghcr.io/${{ github.repository }}:${VERSION}"
          body="${RELEASE_BODY}"$'\n\n'"Images are published by the release pipeline."
          if (( ${#body} > 3800 )); then
            body="${body:0:3797}"$'…'
          fi

          jq -n \
            --arg username "SeerrNG Releases" \
            --arg title "SeerrNG ${VERSION} is live" \
            --arg url "$release_url" \
            --arg description "$body" \
            --arg image "$image_ref" \
            --arg digest "$IMAGE_DIGEST" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              username: $username,
              embeds: [{
                title: $title,
                url: $url,
                description: (if $description == "" then "Release notes are available on GitHub." else $description end),
                color: 5814783,
                fields: [
                  { name: "Image", value: ("`" + $image + "`"), inline: false },
                  { name: "Digest", value: ("`" + $digest + "`"), inline: false },
                  { name: "Workflow", value: $run_url, inline: false }
                ]
              }]
            }' > payload.json

          curl -sS -H "Content-Type: application/json" \
            -X POST \
            --data @payload.json \
            "$DISCORD_WEBHOOK"
