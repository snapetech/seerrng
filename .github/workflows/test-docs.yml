---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Test Docs

on:
  workflow_call:
    inputs:
      plan_sha256:
        required: true
        type: string
      engine_run_id:
        required: true
        type: string
      engine_run_attempt:
        required: true
        type: string
      execution_sha:
        required: true
        type: string
      unit_id:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: test-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Test build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SEERRNG_ENGINE_PLAN_SHA256: ${{ inputs.plan_sha256 }}
      SEERRNG_ENGINE_RUN_ID: ${{ inputs.engine_run_id }}
      SEERRNG_ENGINE_RUN_ATTEMPT: ${{ inputs.engine_run_attempt }}
      SEERRNG_ENGINE_EXECUTION_SHA: ${{ inputs.execution_sha }}
      SEERRNG_ENGINE_UNIT_ID: ${{ inputs.unit_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Pnpm Setup
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Download immutable validation plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: seerrng-engine-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seerrng-engine-plan

      - name: Get pnpm store directory
        shell: sh
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: |
          cd gen-docs
          pnpm install --frozen-lockfile

      - name: Admit engine unit
        id: engine-admission
        run: >-
          node bin/run-local-validation.mjs
          --github-admit
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --plan-file "$RUNNER_TEMP/seerrng-engine-plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-receipts"
          --json

      - name: Test image parser boundaries
        if: steps.engine-admission.outputs.execute == 'true'
        run: |
          cd gen-docs
          pnpm test:security

      - name: Build website
        if: steps.engine-admission.outputs.execute == 'true'
        run: |
          cd gen-docs
          pnpm gen-api-docs && pnpm build

      - name: Seal engine unit receipt
        if: always() && steps.engine-admission.outputs.execute == 'true'
        run: >-
          node bin/run-local-validation.mjs
          --github-receipt
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --plan-file "$RUNNER_TEMP/seerrng-engine-plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-receipts"
          --job-status "${{ job.status }}"
          --json

      - name: Publish engine unit receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seerrng-engine-receipt-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.unit_id }}
          path: ${{ runner.temp }}/seerrng-engine-receipts
          if-no-files-found: error
          retention-days: 1
