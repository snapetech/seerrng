# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Duplicate Issue Detector

on:
  issues:
    types: [opened]

permissions: {}

env:
  EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
  GROQ_MODEL: ${{ vars.GROQ_MODEL }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.user.login }}
  cancel-in-progress: true

jobs:
  admission:
    name: Admit issue triage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: read
    outputs:
      run: ${{ steps.admit.outputs.run }}
    steps:
      - name: Enforce bounded per-author admission
        id: admit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            if (!issue || issue.pull_request || issue.user?.type === 'Bot') {
              core.setOutput('run', 'false');
              return;
            }

            const cutoff = Date.now() - 60 * 60 * 1000;
            let recentIssueCount = 0;
            let reachedOlderIssue = false;
            for (let page = 1; page <= 10 && !reachedOlderIssue; page += 1) {
              const { data } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                creator: issue.user.login,
                state: 'all',
                sort: 'created',
                direction: 'desc',
                per_page: 100,
                page,
              });
              for (const candidate of data) {
                const createdAt = Date.parse(candidate.created_at);
                if (!Number.isFinite(createdAt) || createdAt < cutoff) {
                  reachedOlderIssue = true;
                  break;
                }
                if (!candidate.pull_request) {
                  recentIssueCount += 1;
                  if (recentIssueCount > 10) {
                    core.setOutput('run', 'false');
                    return;
                  }
                }
              }
              if (data.length < 100) {
                break;
              }
            }
            core.setOutput('run', 'true');

  detect-duplicate:
    needs: admission
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: needs.admission.outputs.run == 'true'
    permissions:
      issues: write
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pnpm Setup
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        working-directory: bin/duplicate-detector
        env:
          CI: true
        run: pnpm install --frozen-lockfile

      - name: Download issue index
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        with:
          name: issue-index
          workflow: rebuild-issue-index.yml
          branch: main
          workflow_conclusion: success
          path: ${{ runner.temp }}/issue-index-artifact
          search_artifacts: true
          if_no_artifact_found: warn

      - name: Build index if missing
        working-directory: bin/duplicate-detector
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INDEX_PATH: ${{ runner.temp }}/issue-index-artifact/issue_index.json
        run: |
          set -euo pipefail
          index_directory="$(dirname -- "$INDEX_PATH")"
          if [[ -L "$index_directory" ]] ||
             [[ -e "$index_directory" && ! -d "$index_directory" ]] ||
             [[ -L "$INDEX_PATH" ]]; then
            echo 'Issue index artifact path is unsafe.' >&2
            exit 1
          fi
          if [[ ! -f "$INDEX_PATH" ]]; then
            echo 'No index found — building from scratch...'
            mkdir -p -- "$index_directory"
            node build-index.mjs
          fi

      - name: Detect duplicates
        working-directory: bin/duplicate-detector
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          INDEX_PATH: ${{ runner.temp }}/issue-index-artifact/issue_index.json
        run: node detect.mjs
