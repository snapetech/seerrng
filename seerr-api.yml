      responses:
        '200':
          description: Mapping removed, if present
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [removed]
                properties:
                  removed:
                    type: boolean
        '400':
          description: Invalid library identity
        '403':
          description: Browser session required
        '409':
          description: Source account is disconnected
        '429':
          description: Mapping update rate limit reached
