              properties:
                dataset:
                  type: string
                  maxLength: 32
                team:
                  type: string
                  maxLength: 128
      responses:
        '200':
          description: Already following
        '201':
          description: Following
        '400':
          description: Invalid team
        '403':
          description: The user cannot request recordings
        '409':
          description: Too many followed teams
  /live-tv/sports/follows/{id}:
    delete:
      summary: Stop following a team
      tags:
        - live-tv
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Unfollowed
        '404':
          description: Not following
  /swipe/status:
    get:
      summary: Get swipe availability
      description: Requires the Request permission. Returns 404 when an administrator has turned swipe off.
      tags:
        - swipe
      responses:
        '200':
          description: Swipe is available
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  aiRanking:
                    type: boolean
        '403':
          description: The user cannot make requests
        '404':
          description: Swipe is turned off
  /swipe/deck:
    get:
      summary: Get the user's swipe deck
      description: >-
        Returns up to 20 recommendations from SeerrNG's catalogs (TMDB
        recommendations and trending titles, Open Library subjects and trending
        books). Titles the user owns, requested, or already swiped are left
        out. When an AI provider is configured it reorders the deck and adds a
        reason to each pick.
      tags:
        - swipe
      parameters:
        - in: query
          name: mediaType
          required: true
          schema:
            type: string
            enum: [movie, tv, book]
        - in: query
          name: refresh
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: Deck
          content:
            application/json:
              schema:
                type: object
                properties:
                  mediaType:
                    type: string
                  ranked:
                    type: boolean
                  remaining:
                    type: integer
                  cards:
                    type: array
                    items:
                      $ref: '#/components/schemas/SwipeCard'
        '400':
          description: Invalid media type
        '502':
          description: The catalogs could not be reached
  /swipe/decisions:
    post:
      summary: Record a swipe
      description: >-
        `want` (swipe right) records interest; the client then submits the
        request through `POST /request`. `pass` hides the title for good.
        `seen` marks it as already watched or read and counts as a taste
        signal.
      tags:
        - swipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mediaType, id, decision]
              properties:
                mediaType:
                  type: string
                  enum: [movie, tv, book]
                id:
                  type: string
                  maxLength: 64
                decision:
                  type: string
                  enum: [want, pass, seen]
      responses:
        '200':
          description: Recorded
        '400':
          description: Invalid swipe
        '404':
          description: The card is not in the user's deck
