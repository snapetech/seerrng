  securitySchemes:
    cookieAuth:
      type: apiKey
      name: connect.sid
      in: cookie
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key

paths:
  /desktop/auth-tickets:
    post:
      summary: Issue a one-time native desktop authentication ticket
      description: Creates a 60-second, single-use ticket bound to the signed-in session and linked Jellyfin identity. This operation requires a browser session cookie; API keys are not accepted.
      tags:
        - native desktop
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesktopAuthTicketIssueRequest'
      responses:
        '201':
          description: Native ticket issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesktopAuthTicketIssueResponse'
        '400':
          description: Invalid protocol challenge.
        '403':
          description: A current browser session and HTTPS transport are required.
        '409':
          description: A linked Jellyfin account or protocol-compatible credentials are required.
        '429':
          description: Ticket issue rate limit reached.
  /desktop/auth-tickets/redeem:
    post:
      summary: Redeem a native desktop ticket for a Jellyfin session
      description: Redeems the single-use ticket and PKCE verifier from a native HTTP client. Browser-origin requests are rejected. The response contains sensitive Jellyfin credentials and must never be exposed to browser JavaScript.
      tags:
        - native desktop
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesktopAuthTicketRedeemRequest'
      responses:
        '200':
          description: Native-only Jellyfin playback bootstrap.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesktopAuthBootstrapResponse'
        '400':
          description: Invalid ticket redemption request.
        '401':
          description: Ticket, verifier, session, or Jellyfin identity is invalid or expired.
        '403':
          description: HTTPS is required and browser-origin redemption is not allowed.
        '409':
          description: Ticket has already been consumed or the configured media server is unsupported.
        '429':
          description: Ticket redemption rate limit reached.
        '503':
          description: Jellyfin could not be reached to validate the linked account.
  /association/{mediaType}/{id}:
    get:
      summary: Get cross-medium associations
      description: Returns a ranked graph of similar, recommended, and shared-person associations for movies, series, albums, artists, and books.
      tags:
        - association
      parameters:
        - in: path
          name: mediaType
          required: true
          schema:
            type: string
            enum: [movie, tv, album, artist, book]
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: TMDB ID for movie/TV, MusicBrainz release group ID for album, MusicBrainz artist ID for artist, or Open Library work ID for book.
        - in: query
          name: includeWeak
          schema:
            type: boolean
            default: false
          description: Include lower-confidence shared-genre associations.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 60
          description: Maximum number of association edges to return.
      responses:
        '200':
          description: Ranked association graph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssociationGraph'
        '400':
          description: Invalid association media type.
  /imageproxy/warm:
    post:
      summary: Warm the image cache for visible media
      description: Queues a bounded set of image URLs for authenticated, background cache warming. The response confirms the URLs were accepted, not that upstream downloads have completed.
      tags:
        - other
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - urls
              properties:
                urls:
                  type: array
                  maxItems: 100
                  items:
                    type: string
                    maxLength: 2048
      responses:
        '202':
          description: Image URLs were accepted for background cache warming.
          content:
            application/json:
              schema:
                type: object
                required:
                  - accepted
                properties:
                  accepted:
                    type: boolean
                    enum: [true]
        '400':
          description: The image URL list is invalid or exceeds the request limits.
        '403':
          description: Authentication is required.
        '429':
          description: The cache warming request rate limit was exceeded.
  /status:
    get:
      summary: Get Seerr status
      description: Returns the current Seerr status in a JSON object. updateAvailable and commitsBehind are omitted when checkUpdateAvailable is false.
      security: []
      tags:
        - public
      parameters:
        - in: query
          name: checkUpdateAvailable
          description: If false, updateAvailable and commitsBehind will be omitted from the response. Defaults to the versionCheck setting.
          required: false
          example: false
          schema:
            type: boolean
      responses:
        '200':
          description: Returned status
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: 1.0.0
                  commitTag:
                    type: string
                  updateAvailable:
                    type: boolean
                  commitsBehind:
                    type: number
                  restartRequired:
                    type: boolean
  /status/ready:
    get:
      summary: Check Seerr readiness
      description: Returns success only when the application database is reachable.
      security: []
      tags:
        - public
      responses:
        '204':
          description: Application is ready to receive traffic
        '503':
          description: Application database is unavailable
  /status/tls:
    get:
      summary: Get active browser transport configuration
      description: Returns the configured HTTP/TLS mode, listener ports, allowed TLS hosts, and certificate fingerprint. This endpoint is public so the first-run UI can explain how browser authentication must be performed.
      security: []
      tags:
        - public
      responses:
        '200':
          description: Active transport configuration
          content:
            application/json:
              schema:
                type: object
                required:
                  - mode
                  - httpPort
                  - httpsPort
                  - httpAuthAllowed
                  - redirectsHttpToHttps
                  - hosts
                  - caDownloadAvailable
                  - configuredMode
                  - configuredHttpsPort
                  - configuredHttpAuthAllowed
                  - configuredRedirectsHttpToHttps
                  - environmentOverrides
                  - pendingRestart
                  - setupRequired
                properties:
                  mode:
                    type: string
                    enum: [disabled, self-signed, provided]
                  httpPort:
                    type: integer
                  httpsPort:
                    type: integer
                    nullable: true
                  httpAuthAllowed:
                    type: boolean
                  redirectsHttpToHttps:
                    type: boolean
                  hosts:
                    type: array
                    items:
                      type: string
                  fingerprint:
                    type: string
                  caDownloadAvailable:
                    type: boolean
                  configuredMode:
                    type: string
                    enum: [disabled, self-signed, provided]
                  configuredHttpsPort:
                    type: integer
                    nullable: true
                  configuredHttpAuthAllowed:
                    type: boolean
                  configuredRedirectsHttpToHttps:
                    type: boolean
                  environmentOverrides:
                    type: array
                    items:
                      type: string
                  pendingRestart:
                    type: boolean
                  setupRequired:
                    type: boolean
  /status/tls/bootstrap:
    post:
      summary: Configure transport security before first-user setup
      description: Saves the initial TLS or explicit HTTP-auth choice. This endpoint is available during incomplete first-run setup, or to an authenticated administrator before setup is finalized, and always requires a server restart before the selected listener configuration becomes active.
      security: []
      tags:
        - public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TlsSettings'
      responses:
        '200':
          description: Transport configuration saved; restart is required
          content:
            application/json:
              schema:
                type: object
                required:
                  - mode
                  - pendingRestart
                properties:
                  mode:
                    type: string
                    enum: [disabled, self-signed, provided]
                  pendingRestart:
                    type: boolean
        '400':
          description: Invalid transport configuration
        '403':
          description: Bootstrap configuration is no longer available to this caller
  /status/tls/ca:
    get:
      summary: Download the generated local CA certificate
      description: Returns the public CA certificate for self-signed built-in TLS. The private CA and server keys are never exposed.
      security: []
      tags:
        - public
      responses:
        '200':
          description: PEM-encoded local CA certificate
          content:
            application/x-pem-file:
              schema:
                type: string
        '404':
          description: Built-in self-signed TLS is not active
  /status/appdata:
    get:
      summary: Get application data volume status
      description: For Docker installs, returns whether or not the volume mount was configured properly. Always returns true for non-Docker installs.
      tags:
        - settings
      responses:
        '200':
          description: Application data volume status and path
          content:
            application/json:
              schema:
                type: object
                properties:
                  appData:
                    type: boolean
                    example: true
                  appDataPath:
                    type: string
                    example: /app/config
                  appDataPermissions:
                    type: boolean
                    example: true
  /settings/main:
    get:
      summary: Get main settings
      description: Retrieves all main settings in a JSON object.
      tags:
        - settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MainSettings'
    post:
      summary: Update main settings
      description: Updates main settings with the provided values.
      tags:
        - settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MainSettings'
      responses:
        '200':
          description: 'Values were sucessfully updated'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MainSettings'
  /settings/network:
    get:
