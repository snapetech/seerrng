  /integrations/discovery/feeds/{provider}/{feed}:
    get:
      summary: Browse provider discovery feeds
      tags:
        - discover
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum:
              - trakt
              - anilist
              - mdblist
        - name: feed
          in: path
          required: true
          schema:
            type: string
            enum:
              - watchlist
              - history
              - recommendations-movie
              - recommendations-tv
              - library
              - trending
              - popular
              - top
              - next-season
              - list
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: list
          in: query
          schema:
            type: string
            maxLength: 2048
      responses:
        '200':
          description: A bounded provider feed page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryFeedPage'
        '400':
          description: Invalid feed
        '404':
          description: The requested public MDBList list could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryProviderError'
        '409':
          description: Reconnect the account or configure MDBList
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryProviderError'
        '429':
          description: Provider quota reached; wait for Retry-After before retrying
          headers:
            Retry-After:
              description: Minimum number of seconds before retrying, capped at one hour
              schema:
                type: integer
                minimum: 1
                maximum: 3600
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryProviderError'
        '502':
          description: Provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryProviderError'

  /integrations/discovery/library/{provider}:
    get:
      summary: Browse a page of your personal provider or media server library
      description: For Plex, Jellyfin, and Emby in-progress shelves, pass the previous response's nextCursor as cursor to continue a bounded scan. Other providers use page pagination.
      tags:
        - user
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [trakt, anilist, simkl, plex, jellyfin, emby]
        - name: shelf
          in: query
          schema:
            type: string
            enum:
              [
                all,
                watchlist,
                watched,
                unwatched,
                in-progress,
                completed,
                rated,
              ]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 1
        - name: cursor
          in: query
          description: Cursor returned by the prior media-server in-progress page.
          schema:
            type: integer
            minimum: 0
            maximum: 100000
        - name: mediaType
          in: query
          schema:
            type: string
            enum: [movie, tv]
        - name: libraryId
          in: query
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: A bounded page from the current user's personal library
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalLibraryPage'
        '400':
          description: Invalid library shelf or page
        '403':
          description: Browser session or media permission required
        '409':
          description: Provider account needs to be connected
        '429':
          description: Provider quota reached; retry later
        '502':
          description: Provider unavailable
  /integrations/discovery/library/{provider}/repair:
    post:
      summary: Save exact external-ID matches across bounded provider-library pages
      description: Scans up to five pages per request. Only unique confirmed IMDb or TVDB matches are stored as private user mappings; existing personal or curated matches are not overwritten.
      tags:
        - user
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [trakt, anilist, simkl]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderLibraryRepairRequest'
      responses:
        '200':
          description: Completed bounded provider-library identity scan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderLibraryRepairResult'
        '400':
          description: Invalid provider, shelf, or scan range
        '403':
          description: Browser session or media permission required
        '409':
          description: Provider account needs to be connected
        '429':
          description: Provider or scan quota reached; continue later
        '502':
          description: Provider unavailable
  /integrations/discovery/mappings:
    put:
      summary: Match a personal library item to a TMDB title
      tags:
        - user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoveryIdentityMappingRequest'
      responses:
        '200':
          description: Personal title match saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryIdentityMapping'
        '400':
          description: Invalid library identity or TMDB match
        '403':
          description: Browser session or enabled media category required
        '409':
          description: Source account is disconnected or the mapping limit was reached
        '429':
          description: Mapping update rate limit reached
        '502':
          description: TMDB could not confirm the selected title
  /integrations/discovery/mappings/pack:
    get:
      summary: Export the current user's private title matches
      tags:
        - user
      responses:
        '200':
          description: Versioned personal title-match pack without provider credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalIdentityMappingPack'
        '403':
          description: Browser session required
    post:
      summary: Import a versioned pack of private title matches
      tags:
        - user
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              maxLength: 5242880
              description: UTF-8 JSON text containing a PersonalIdentityMappingPack
      responses:
        '200':
          description: Imported, updated, and unchanged mapping totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalIdentityMappingPackImportResult'
        '400':
          description: Invalid or unsupported pack
        '403':
          description: Browser session required
        '409':
          description: Per-user saved title-match limit reached
        '413':
          description: Pack exceeds the 5 MiB upload limit
        '429':
          description: Pack import rate limit reached
  /integrations/discovery/mappings/packs:
    get:
      summary: List administrator-managed title-match packs shared by all accounts
      tags:
        - admin
      responses:
        '200':
          description: Shared mapping-pack names, update times, and entry counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CuratedIdentityPackList'
        '403':
          description: Administrator permission required
    post:
      summary: Import or replace an administrator-managed shared title-match pack
      tags:
        - admin
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              maxLength: 5242880
              description: UTF-8 JSON text containing a CuratedIdentityMappingPack
      responses:
        '200':
          description: Shared entries imported, updated, retained, or removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CuratedIdentityPackImportResult'
        '400':
          description: Invalid or unsupported pack
        '403':
          description: Administrator permission and browser session required
        '409':
          description: Another shared pack owns one of these provider identities or the pack limit is reached
        '413':
          description: Pack exceeds the 5 MiB upload limit
        '429':
          description: Shared pack import rate limit reached
  /integrations/discovery/mappings/packs/{packId}:
    get:
      summary: Export an administrator-managed shared title-match pack
      tags:
        - admin
      parameters:
        - name: packId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
            pattern: '^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$'
      responses:
        '200':
          description: Versioned shared pack without provider credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CuratedIdentityMappingPack'
        '403':
          description: Administrator permission required
        '404':
          description: Shared pack not found
    delete:
      summary: Delete a shared title-match pack for every account
      tags:
        - admin
      parameters:
        - name: packId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
            pattern: '^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$'
      responses:
        '200':
          description: Shared pack removed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [removed]
                properties:
                  removed:
                    type: boolean
                    enum: [true]
        '403':
          description: Administrator permission and browser session required
        '404':
          description: Shared pack not found
        '429':
          description: Shared pack modification rate limit reached
  /integrations/discovery/mappings/{identity}:
    delete:
      summary: Remove a personal library title match
