          description: Request is no longer awaiting approval
  /request:
    get:
      summary: Get all requests
      description: |
        Returns all requests if the user has the `ADMIN` or `MANAGE_REQUESTS` permissions. Otherwise, only the logged-in user's requests are returned.

        If the `requestedBy` parameter is specified, only requests from that particular user ID will be returned.
      tags:
        - request
      parameters:
        - in: query
          name: take
          schema:
            type: number
            nullable: true
            example: 20
        - in: query
          name: skip
          schema:
            type: number
            nullable: true
            example: 0
        - in: query
          name: filter
          schema:
            type: string
            nullable: true
            enum:
              [
                all,
                recent,
                approved,
                available,
                pending,
                processing,
                unavailable,
                failed,
                deleted,
                completed,
              ]
        - in: query
          name: sort
          schema:
            type: string
            enum: [added, modified]
            default: added
        - in: query
          name: sortDirection
          schema:
            type: string
            enum: [asc, desc]
            nullable: true
            default: desc
        - in: query
          name: requestedBy
          schema:
            type: number
            nullable: true
            example: 1
        - in: query
          name: mediaType
          schema:
            type: string
            enum: [movie, tv, music, book, comic, magazine, all]
            nullable: true
            default: all
        - in: query
          name: category
          description: Restrict results to one software request category.
          schema:
            type: string
            enum: [retro, modern, game]
      responses:
        '200':
          description: Requests returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/MediaRequest'
    post:
      summary: Create new request
      description: |
        Creates a new request with the provided media ID and type. The `REQUEST` permission is required.

        If the user has the `ADMIN` or `AUTO_APPROVE` permissions, their request will be auomatically approved.
      tags:
        - request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mediaType:
                  type: string
                  enum: [movie, tv, music, book, comic, magazine]
                  example: movie
                mediaId:
                  oneOf:
                    - type: number
                      example: 123
                    - type: string
                      example: OL27448W
                tvdbId:
                  type: number
                  example: 123
                seasons:
                  oneOf:
                    - type: array
                      items:
                        type: number
                        minimum: 0
                    - type: string
                      enum: [all]
                seasonRequests:
                  type: array
                  description: Exact season and episode selections. Omit episodeNumbers to request an entire season.
                  items:
                    $ref: '#/components/schemas/SeasonEpisodeSelection'
                watchAheadEpisodeCount:
                  type: integer
                  minimum: 0
                  maximum: 5
                  description: Optional Jellyfin watch-ahead buffer for the requesting user's TV request.
                is4k:
                  type: boolean
                  example: false
                serverId:
                  type: number
                profileId:
                  type: number
                rootFolder:
                  type: string
                  description: For an advanced Kapowarr comic request, choose a path returned by /service/comic/{id}/rootfolders. If omitted, the service's configured default is used.
                languageProfileId:
                  type: number
                metadataProfileId:
                  type: number
                tags:
                  type: array
                  items:
                    type: number
                format:
                  type: string
                  enum: [ebook, audiobook, both]
                  description: Book request format.
                editionId:
                  type: string
                  example: OL8934157M
                isbn13:
                  type: string
                  example: '9780441478125'
                authorId:
                  type: string
                  example: OL23919A
                userId:
                  type: number
                  nullable: true
                ignoreQuota:
                  type: boolean
                  example: false
                  description: If true, this request will not count against the user's quota. Requires MANAGE_REQUESTS permission.
              required:
                - mediaType
                - mediaId
      responses:
        '201':
          description: Succesfully created the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaRequest'
  /request/bulk:
    post:
      summary: Create bulk media requests
      description: |
        Creates individual music or book requests for the selected items. Duplicate, covered, or blocklisted items are returned in the summary instead of failing the whole batch. Quota overage rejects before any requests are created.
      tags:
        - request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkMediaRequestBody'
      responses:
        '207':
          description: Bulk request summary returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkMediaRequestResponse'
  /request/count:
    get:
      summary: Gets request counts
      description: |
        Returns the number of requests by status including pending, approved, declined, failed, available, and completed requests.
      tags:
        - request
      responses:
        '200':
          description: Request counts returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                  movie:
                    type: number
                  tv:
                    type: number
                  music:
                    type: number
                  book:
                    type: number
                  pending:
                    type: number
                  approved:
                    type: number
                  declined:
                    type: number
                  failed:
                    type: number
                  processing:
                    type: number
                  available:
                    type: number
                  completed:
                    type: number
  /request/software:
    post:
      summary: Submit a ROM or PC game request
      description: Creates a SeerrNG software request from the configured IGDB catalog. Emulation uses the selected QuestarrNG or ROMarrNG catalog and is acquired by ROMarrNG; PC game requests use QuestarrNG and require operating system and architecture.
      tags:
        - request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, catalogId]
              properties:
                category:
                  type: string
                  enum: [retro, modern, game]
                catalogId:
                  type: integer
                  minimum: 1
                platformSlug:
                  type: string
                variant:
                  type: object
                  required: [operatingSystem, architecture]
                  properties:
                    operatingSystem:
                      type: string
                      enum: [windows, linux, macos]
                    architecture:
                      type: string
                      enum: [x64, arm64, x86, universal]
      responses:
        '201':
          description: Software request submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoftwareRequestMutationResponse'
        '400':
          description: Invalid title, category, system, or PC target
        '403':
          description: Caller lacks request permission or has reached the software request quota
        '409':
          description: Matching request already exists
  /request/software/catalog/systems:
    get:
      summary: List ROMarrNG-supported emulation systems
      description: Returns ROMarrNG-supported platform slugs and the Retro or Modern group assigned by an administrator. Unassigned systems are not requestable, regardless of which service supplies the emulation IGDB catalog.
      tags:
        - request
      responses:
        '200':
          description: Supported emulation systems returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
  /request/software/catalog/search:
    get:
      summary: Search ROM and PC game catalog
      description: Searches the selected QuestarrNG or ROMarrNG IGDB catalog for emulation categories, or QuestarrNG for PC games. Results are filtered to the requested emulation group or PC platform and include availability (available, tracked, downloading, missing, or unknown) and ROM availableSystems when known. Pass the returned nextCursor to load the next page.
      tags:
        - request
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - in: query
          name: category
          required: true
          schema:
            type: string
            enum: [retro, modern, game]
        - in: query
          name: system
          description: ROMarrNG system slug for Retro or Modern results.
          schema:
            type: string
            maxLength: 64
        - in: query
          name: platform
          description: PC operating-system platform for game results.
          schema:
            type: string
            enum: [windows, linux, macos]
        - in: query
          name: genre
          description: IGDB genre name, matched before pagination.
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - in: query
          name: releaseYear
          description: UTC release year, matched before pagination.
          schema:
            type: integer
            minimum: 1950
            maximum: 2200
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 24
        - in: query
          name: cursor
          schema:
            type: string
            maxLength: 20000
      responses:
        '200':
          description: Matching catalog titles returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                  nextCursor:
                    type: string
                    nullable: true
        '503':
          description: Selected emulation catalog is unavailable, unconfigured, or needs the SeerrNG integration contract.
  /request/software/catalog/popular:
    get:
      summary: List popular ROM and PC game catalog titles
      description: Returns popular titles from the selected QuestarrNG or ROMarrNG IGDB catalog for emulation, or QuestarrNG for PC games. Results are filtered to the selected emulation group or PC platform and include provider and SeerrNG request availability. Pass the returned nextOffset to load the next page.
      tags:
        - request
      parameters:
        - in: query
          name: category
          required: true
          schema:
            type: string
            enum: [retro, modern, game]
        - in: query
          name: system
          description: ROMarrNG system slug for Retro or Modern results.
          schema:
            type: string
            maxLength: 64
        - in: query
          name: platform
          description: PC operating-system platform for game results.
          schema:
            type: string
            enum: [windows, linux, macos]
        - in: query
          name: genre
          description: IGDB genre name, matched before pagination.
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - in: query
          name: releaseYear
          description: UTC release year, matched before pagination.
          schema:
            type: integer
            minimum: 1950
            maximum: 2200
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 24
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            maximum: 10000
      responses:
        '200':
          description: Popular catalog titles returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                  nextOffset:
                    type: integer
                    nullable: true
        '503':
          description: Selected emulation catalog is unavailable, unconfigured, or needs the SeerrNG integration contract.
  /request/software/catalog/games/{id}:
    get:
      summary: Get one ROM or PC game catalog title
      description: Returns metadata from the selected QuestarrNG or ROMarrNG IGDB catalog for emulation, or QuestarrNG for PC games, with supported request targets, screenshots, video IDs, rating normalized to a 0-10 scale, and provider or SeerrNG request availability.
      tags:
        - request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
        - in: query
          name: category
          required: true
          schema:
            type: string
            enum: [retro, modern, game]
      responses:
        '200':
          description: Software catalog title returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  game:
                    type: object
        '404':
          description: Title not found in the selected category
        '503':
          description: Selected emulation catalog is unavailable or unconfigured
  /game-library:
    get:
      summary: List the signed-in user's personal game library
      description: Returns only the caller's entries, progress, ownership facts, private sharing setting, and the caller's own latest software request state.
      tags: [game library]
      parameters:
        - in: query
          name: q
          schema:
            type: string
            maxLength: 120
        - in: query
          name: status
          schema:
            type: string
            enum: [backlog, playing, played, completed, paused, dropped]
        - in: query
          name: category
          schema:
            type: string
            enum: [game, retro, modern]
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 48
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            maximum: 9999999
            default: 0
      responses:
        '200':
          description: Personal game library page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryPage'
        '400':
          description: Invalid filter or pagination input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryErrorResponse'
        '401':
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryErrorResponse'
        '403':
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryErrorResponse'
    post:
      summary: Add a catalog title to the caller's personal game library
      description: Adds a private backlog entry by default. Existing progress, ownership, and sharing choices are preserved when a title is already tracked. Requires a signed-in browser session.
      tags: [game library]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameLibraryMutation'
      responses:
        '200':
          description: Existing library entry returned after refreshing catalog metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryMutationResponse'
        '400':
          description: Invalid game or library state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryErrorResponse'
        '403':
          description: A browser session is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryErrorResponse'
        '502':
          description: The configured catalog could not confirm the title
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryErrorResponse'
  /game-library/manual:
    post:
      summary: Add a game that is missing from the catalog
      description: Creates a private personal entry without requiring a catalog or acquisition provider. Requires a signed-in browser session.
      tags: [game library]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameLibraryManualMutation'
      responses:
        '201':
          description: Manual game added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryMutationResponse'
        '200':
          description: Matching manual entry already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryMutationResponse'
        '400':
          description: Invalid game title or library state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryErrorResponse'
        '403':
          description: A browser session is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryErrorResponse'
  /game-library/shared:
    get:
      summary: Browse games explicitly shared by household members
      description: Returns only entries whose owners opted in and marked them owned. Owner names, progress, store, and playtime are visible only for a shared owned title.
      tags: [game library]
      parameters:
        - in: query
          name: q
          schema:
            type: string
            maxLength: 120
        - in: query
          name: minOwners
          description: Use 2 to show titles shared by at least two owners.
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 48
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            maximum: 9999999
            default: 0
      responses:
        '200':
          description: Shared game library page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedGameLibraryPage'
        '400':
          description: Invalid filter or pagination input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryErrorResponse'
        '401':
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryErrorResponse'
        '403':
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryErrorResponse'
  /game-library/lookup:
    get:
      summary: Check whether the caller tracks a catalog game
      description: The response contains only the caller's own entry and does not reveal household data.
      tags: [game library]
      parameters:
        - in: query
          name: category
          required: true
          schema:
            type: string
            enum: [game, retro, modern]
        - in: query
          name: catalogId
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        '200':
          description: Caller-specific tracked entry, if present
          content:
            application/json:
              schema:
                type: object
                required: [entry]
                properties:
                  entry:
                    type: object
                    nullable: true
                    properties:
                      id:
                        type: integer
                        minimum: 1
        '400':
          description: Invalid catalog lookup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryErrorResponse'
        '403':
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryErrorResponse'
  /game-library/{id}:
    patch:
      summary: Update the caller's game progress and sharing choices
      description: Only the owner can update an entry. Sharing requires the caller to mark the game owned.
      tags: [game library]
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameLibraryPatch'
      responses:
        '200':
          description: Updated personal entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryMutationResponse'
        '400':
          description: Invalid state or sharing an unowned title
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryErrorResponse'
        '403':
          description: A browser session is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryErrorResponse'
        '404':
          description: Entry not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryErrorResponse'
    delete:
      summary: Remove one of the caller's game library entries
      tags: [game library]
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: Entry removed
        '403':
          description: A browser session is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryErrorResponse'
        '404':
          description: Entry not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryErrorResponse'
  /game-library/{id}/match:
    post:
      summary: Match an imported game to a software catalog title
      description: Explicitly links one of the caller's unmatched Steam or manual titles to QuestarrNG's PC game catalog, without automatic title guessing.
      tags: [game library]
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameLibraryMutation'
      responses:
        '200':
          description: Catalog match applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryMutationResponse'
        '400':
          description: Invalid catalog match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryErrorResponse'
        '403':
          description: A browser session is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryErrorResponse'
        '404':
          description: Entry not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryErrorResponse'
        '409':
          description: Entry is already matched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryErrorResponse'
        '502':
          description: Catalog provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryErrorResponse'
  /game-library/steam/status:
    get:
      summary: Get the caller's Steam link and sync status
      tags: [game library]
      responses:
        '200':
          description: Private caller-specific Steam status; never returns the administrator API key
          content:
            application/json:
              schema:
                type: object
                required:
                  [connected, lastSyncedAt, lastSyncCount, apiKeyConfigured]
                properties:
                  connected:
                    type: boolean
                  lastSyncedAt:
                    type: string
                    format: date-time
                    nullable: true
                  lastSyncCount:
                    type: integer
                  apiKeyConfigured:
                    type: boolean
        '403':
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryErrorResponse'
  /game-library/steam/connect:
    get:
      summary: Start the Steam OpenID account linking flow
      description: Starts a one-use, session-bound Steam identity verification. Requires a configured SeerrNG application URL and a signed-in browser session.
      tags: [game library]
      security:
        - cookieAuth: []
      responses:
        '302':
          description: Redirect to Steam to authenticate the account
        '400':
          description: Application URL is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryErrorResponse'
        '403':
          description: A browser session is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryErrorResponse'
  /game-library/steam/callback:
    get:
      summary: Complete the Steam OpenID account linking flow
      description: Validates the session state, exact callback URL, Steam issuer, signed identity assertion, and Steam's check_authentication response before linking an account.
      tags: [game library]
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: state
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{64}$
        - in: query
          name: openid.ns
          schema:
            type: string
        - in: query
          name: openid.mode
          schema:
            type: string
        - in: query
          name: openid.op_endpoint
          schema:
            type: string
        - in: query
          name: openid.claimed_id
          schema:
            type: string
        - in: query
          name: openid.identity
          schema:
            type: string
        - in: query
          name: openid.return_to
          schema:
            type: string
        - in: query
          name: openid.response_nonce
          schema:
            type: string
        - in: query
          name: openid.assoc_handle
          schema:
            type: string
        - in: query
          name: openid.signed
          schema:
            type: string
        - in: query
          name: openid.sig
          schema:
            type: string
        - in: query
          name: openid.invalidate_handle
          schema:
            type: string
      responses:
        '302':
          description: Redirect back to My Games with a connection result
        '403':
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryErrorResponse'
  /game-library/steam/sync:
    post:
      summary: Synchronize the caller's public Steam game library
      description: Imports owned Steam titles and playtime. Unmatched Steam games remain private; sync never changes manual progress, and missing titles are no longer treated as Steam-owned. Requires a signed-in browser session and an administrator-configured API key.
      tags: [game library]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Sync counts
          content:
            application/json:
              schema:
                type: object
                required: [imported, updated, total]
                properties:
                  imported:
                    type: integer
                  updated:
                    type: integer
                  total:
                    type: integer
        '403':
          description: A browser session is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryErrorResponse'
        '409':
          description: Steam account is not linked or game details are private
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryErrorResponse'
        '413':
          description: Steam returned more titles than the sync limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryErrorResponse'
        '503':
          description: Steam API key is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryErrorResponse'
        '502':
          description: Steam is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryErrorResponse'
        '429':
          description: Steam sync rate limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryErrorResponse'
  /game-library/steam:
    delete:
      summary: Unlink Steam from the caller's game library
      description: Removes the account link, preserves imported titles and playtime, and clears verified Steam ownership and household sharing for entries not manually marked owned.
      tags: [game library]
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Steam account unlinked
        '403':
          description: A browser session is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLibraryErrorResponse'
  /request/software/status:
    get:
      summary: List software request status
      description: Returns request ownership, lifecycle state, verified available assets, and pageInfo. Users with request-view permission may inspect other users' software requests.
      tags:
        - request
      parameters:
        - in: query
          name: take
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: skip
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: requestedBy
          schema:
            type: integer
            minimum: 1
        - in: query
          name: requestId
          description: Restrict the result to a single software request, as used by availability notification links.
          schema:
            type: integer
            minimum: 1
        - in: query
          name: filter
          description: Filter software requests using the Requests page status groups. Groups without a software equivalent, such as incomplete and unavailable, return no software requests.
          schema:
            type: string
            enum:
              [
                all,
                pending,
                approved,
                processing,
                active,
                incomplete,
                attention,
                completed,
                unavailable,
                requested,
                searching,
                downloading,
                importing,
                library,
                available,
                failed,
                declined,
                cancelled,
              ]
            default: all
      responses:
        '200':
          description: Software request status returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoftwareRequestsResponse'
  /request/software/status/{id}:
    get:
      summary: Get software request status and history
      description: Returns one software request and its lifecycle history when the caller may view it.
      tags:
        - request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Software request details returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoftwareRequestDetailResponse'
        '404':
          description: Request not found or caller may not view it
    delete:
      summary: Clear a cancelled software request
      description: Permanently removes the caller's cancelled software request and saved status history. Request managers may clear any cancelled request.
      tags:
        - request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: Cancelled software request cleared
        '404':
          description: Request not found or caller may not clear it
        '409':
          description: Request is not cancelled
  /request/software/status/{id}/approve:
    post:
      summary: Approve a software request
      description: Approves a pending software request and dispatches it idempotently to its acquisition provider. Requires MANAGE_REQUESTS.
      tags:
        - request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Software request approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoftwareRequestMutationResponse'
        '409':
          description: Request is no longer pending
  /request/software/status/{id}/decline:
    post:
      summary: Decline a software request
      description: Declines a pending software request. Requires MANAGE_REQUESTS.
      tags:
        - request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Software request declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoftwareRequestMutationResponse'
        '409':
          description: Request is no longer pending
  /request/software/status/{id}/withdraw:
    post:
      summary: Withdraw a pending software request
      description: Allows the requester to withdraw their own request before provider dispatch. Requires REQUEST permission.
      tags:
        - request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Software request withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoftwareRequestMutationResponse'
        '403':
          description: Request permission is required
        '404':
          description: Request not found or caller is not the requester
        '409':
          description: Request is no longer pending
  /request/software/status/{id}/cancel:
    post:
      summary: Cancel an active software request
      description: Lets the original requester with REQUEST permission or an administrator with MANAGE_REQUESTS cancel provider work. QuestarrNG stops only downloads correlated to this request; ROMarrNG cancellation is available before download handoff. An interrupted handoff can require explicit confirmation after checking the download queue and history.
      tags:
        - request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmNoExistingDownload:
                  type: boolean
                  description: Set true only after checking the download client queue and history for a matching download.
      responses:
        '200':
          description: Provider confirmed that the request was cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoftwareRequestMutationResponse'
        '403':
          description: Caller does not have permission to manage this request
        '404':
          description: Request not found or caller may not view it
        '409':
          description: Provider cannot safely cancel the request in its current state
          content:
            application/json:
              schema:
                type: object
                properties:
                  confirmationRequired:
                    type: string
                    enum: [confirmNoExistingDownload]
                  error:
                    type: string
        '502':
          description: Acquisition provider is unavailable
  /request/software/status/{id}/retry:
    post:
      summary: Retry a failed software request
      description: Retries a failed provider request using its existing idempotency key. The original requester must still have REQUEST permission, or the caller must have MANAGE_REQUESTS. QuestarrNG or ROMarrNG can require explicit confirmation when a restart interrupted a download handoff.
      tags:
        - request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmNoExistingDownload:
                  type: boolean
                  description: Set true only after checking the download client queue and history for a matching download.
      responses:
        '200':
          description: Software request retry started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoftwareRequestMutationResponse'
        '409':
          description: Request is not failed or the provider requires a download handoff confirmation
          content:
            application/json:
              schema:
                type: object
                properties:
                  confirmationRequired:
                    type: string
                    enum: [confirmNoExistingDownload]
                  error:
                    type: string
  /request/software/status/{id}/downloads:
    get:
      summary: List available files for a software request
      description: Returns verified, imported request assets only. Provider URLs and local paths are never returned.
      tags:
        - request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Downloadable software files returned
          content:
            application/json:
              schema:
                type: object
  /request/software/status/{id}/downloads/{assetId}:
    get:
      summary: Download a software request asset through SeerrNG
      description: Streams one verified, request-scoped provider asset after checking request access and current availability.
      tags:
        - request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
        - in: path
          name: assetId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Asset bytes streamed to the caller
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Requested byte range streamed when supported by the provider
        '404':
          description: Request or asset not found or no longer available
  /request/status:
    get:
      summary: Get request lifecycle status
      description: |
        Returns request lifecycle projections for the authenticated user. Users with `MANAGE_REQUESTS` or `REQUEST_VIEW` may inspect all users' requests and may narrow the result with `requestedBy`.

        Status filters are evaluated against current media availability and the latest synchronized download queue snapshot, so a request is not hidden by a stale historical stage.
      tags:
        - request
      parameters:
        - in: query
          name: take
          schema:
            type: number
            minimum: 1
            maximum: 100
            default: 10
        - in: query
          name: skip
          schema:
            type: number
            minimum: 0
            default: 0
        - in: query
          name: requestedBy
          schema:
            type: number
            minimum: 1
        - in: query
          name: requestId
          description: Restrict results to one request; used by Request Status notification links.
          schema:
            type: number
            minimum: 1
        - in: query
          name: mediaId
          description: Restrict results to requests for one internal media record.
          schema:
            type: number
            minimum: 1
        - in: query
          name: bookFormat
          description: Restrict book requests to ebook-compatible or audiobook-compatible requests.
          schema:
            type: string
            enum: [ebook, audiobook]
        - in: query
          name: timeFrame
          description: Restrict results to requests created in the selected rolling time window. Defaults to the last 7 days; use all for complete history.
          schema:
            type: string
            enum: [7d, 14d, 30d, 1m, 6m, all]
            default: 7d
        - in: query
          name: sort
          description: Sort field. Metadata-backed fields are resolved from the configured metadata provider and fall back safely when unavailable.
          schema:
            type: string
            enum:
              [
                added,
                modified,
                status,
                incomplete,
                title,
                director,
                writer,
                rating,
                releaseDate,
                artist,
                author,
                publisher,
              ]
            default: added
        - in: query
          name: sortDirection
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - in: query
          name: mediaType
          schema:
            type: string
            enum: [movie, tv, music, book, comic, magazine, all]
            default: all
        - in: query
          name: filter
          schema:
            type: string
            enum:
              [
                all,
                pending,
                processing,
                deleted,
                active,
                incomplete,
                attention,
                requested,
                approved,
                searching,
                downloading,
                importing,
                library,
                available,
                unavailable,
                failed,
                declined,
                cancelled,
                completed,
              ]
            default: all
        - in: query
          name: search
          description: Search locally stored request, media, requester, service, and external identifier metadata.
          schema:
            type: string
            maxLength: 512
            nullable: true
      responses:
        '200':
          description: Request lifecycle statuses returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestStatusPage'
  /request/status/users:
    get:
      summary: Get users available for request status viewing
      description: Returns minimal user identities for users with request-view permission selecting another user's request history. No account or permission fields are returned.
      tags:
        - request
      parameters:
        - in: query
          name: take
          schema:
            type: number
            minimum: 1
            maximum: 100
            default: 100
        - in: query
          name: skip
          schema:
            type: number
            minimum: 0
            default: 0
      responses:
        '200':
          description: Status viewer users returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        displayName:
                          type: string
                        avatar:
                          type: string
                      required: [id, displayName, avatar]
                required: [pageInfo, results]
  /request/status/{requestId}:
    get:
      summary: Get request lifecycle history
      description: Returns the current lifecycle projection and durable status history for a request the caller may view.
      tags:
        - request
      parameters:
        - in: path
          name: requestId
          required: true
          description: Request ID
          schema:
            type: string
            example: '1'
      responses:
        '200':
          description: Request lifecycle status and history returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestStatusDetail'
  /request/status/{requestId}/downloads:
    get:
      summary: List downloadable copies for a request
      description: Returns verified imported files only when the caller may view the request and its current lifecycle stage is available. Filesystem paths and provider credentials are never returned.
      tags:
        - request
      parameters:
        - in: path
          name: requestId
          required: true
          description: Request ID
          schema:
            type: string
            example: '1'
      responses:
        '200':
          description: Downloadable copies returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Opaque, request-scoped asset ID.
                        name:
                          type: string
                        size:
                          type: integer
                          minimum: 0
                        format:
                          type: string
                          description: Book file format; omitted for non-book assets.
                          enum: [ebook, audiobook]
                      required: [id, name]
                  hadErrors:
                    type: boolean
                    description: True when one or more provider lookups failed; results may still contain usable files.
                required: [results, hadErrors]
        '403':
          description: Caller may not view this request
        '404':
          description: Request not found
  /request/status/{requestId}/downloads/{assetId}:
    get:
      summary: Download a request asset through SeerrNG
      description: Streams one verified request asset after rechecking request access and availability. Provider URLs, credentials, and filesystem paths stay server-side.
      tags:
        - request
      parameters:
        - in: path
          name: requestId
          required: true
          description: Request ID
          schema:
            type: string
            example: '1'
        - in: path
          name: assetId
          required: true
          description: Opaque asset ID returned by the downloads listing.
          schema:
            type: string
      responses:
        '200':
          description: Asset bytes streamed to the caller
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Requested byte range streamed for a filesystem-backed asset
        '403':
          description: Caller may not view this request
        '404':
          description: Request or asset not found or no longer available
  /request/{requestId}:
    get:
      summary: Get MediaRequest
      description: Returns a specific MediaRequest in a JSON object.
      tags:
        - request
      parameters:
        - in: path
          name: requestId
          description: Request ID
          required: true
          example: '1'
          schema:
            type: string
      responses:
        '200':
          description: Succesfully returns request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaRequest'
    put:
      summary: Update MediaRequest
      description: Updates a specific media request and returns the request in a JSON object. Requires the `MANAGE_REQUESTS` permission.
      tags:
        - request
      parameters:
        - in: path
          name: requestId
          description: Request ID
          required: true
          example: '1'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mediaType:
                  type: string
                  enum: [movie, tv, music, book, comic, magazine]
                seasons:
                  type: array
                  items:
                    type: number
                    minimum: 0
                watchAheadEpisodeCount:
                  type: integer
                  minimum: 0
                  maximum: 5
                  description: Jellyfin watch-ahead buffer for a pending TV request.
                is4k:
                  type: boolean
                  example: false
                serverId:
                  type: number
                profileId:
                  type: number
                rootFolder:
                  type: string
                languageProfileId:
                  type: number
                metadataProfileId:
                  type: number
                tags:
                  type: array
                  items:
                    type: number
                format:
                  type: string
                  enum: [ebook, audiobook, both]
                  description: Book request format.
                userId:
                  type: number
                  nullable: true
              required:
                - mediaType
      responses:
        '200':
          description: Succesfully updated request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaRequest'
        '409':
          description: Only pending requests can be modified
    delete:
      summary: Delete request
      description: Removes a request. If the user has the `MANAGE_REQUESTS` permission, any request can be removed. Otherwise, only pending requests can be removed.
      tags:
        - request
      parameters:
        - in: path
          name: requestId
          description: Request ID
          required: true
          example: '1'
          schema:
            type: string
      responses:
        '204':
          description: Succesfully removed request
  /request/{requestId}/watch-ahead:
    put:
      summary: Update Jellyfin episode watch-ahead
      description: |
        Sets the number of upcoming episodes to keep requested for a Jellyfin-linked TV request. Only the request owner can enable or change the buffer; setting episodeCount to 0 disables future watch-ahead requests.
      tags:
        - request
      parameters:
        - in: path
          name: requestId
          description: TV request ID
          required: true
          schema:
            type: string
            example: '1'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [episodeCount]
              properties:
                episodeCount:
                  type: integer
                  minimum: 0
                  maximum: 5
      responses:
        '200':
          description: Updated TV request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaRequest'
        '400':
          description: The request is not eligible for watch-ahead
        '403':
          description: Only the request owner can enable watch-ahead
        '404':
          description: Request not found
        '409':
          description: Jellyfin or Sonarr is not configured, the series has no TVDB identity, or the request cannot be enrolled
  /request/{requestId}/fail-download:
    post:
      summary: Fail an active request download and search again
      description: |
        Removes and blocklists the selected active Radarr or Sonarr release, then starts a fresh search. The request owner may use this action while they still have permission to request the media; users with `MANAGE_REQUESTS` may use it on any request.
      tags:
        - request
      parameters:
        - in: path
          name: requestId
          description: Request ID
          required: true
          schema:
            type: string
            example: '1'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [downloadId]
              properties:
                downloadId:
                  type: string
                  minLength: 1
                  maxLength: 2048
                  description: Identifier of the active Radarr or Sonarr queue download.
      responses:
        '200':
          description: Release removed and a new search started
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                    enum: [true]
        '400':
          description: Invalid download identifier or unsupported request media type
        '401':
          description: Authentication required
        '403':
          description: Caller may not manage this request download
        '404':
          description: Request not found
        '409':
          description: Request is not active, the selected download is stale, or its acquisition service changed
        '502':
          description: The release was removed but a new search could not be started, or the acquisition service failed
  /request/{requestId}/retry:
    post:
      summary: Retry failed or unavailable request
      description: |
        Retries a failed or unavailable request by returning it to the normal dispatch/search flow. The request owner may retry their own request when they still have permission to request that media; users with `MANAGE_REQUESTS` or `ADMIN` may retry any request.

      tags:
        - request
      parameters:
        - in: path
          name: requestId
          description: Request ID
          required: true
          schema:
            type: string
            example: '1'
      responses:
        '200':
          description: Retry triggered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaRequest'
  /request/{requestId}/status:
    delete:
      summary: Delete request status entry
      description: |
        Cancels and cleans up active work when required, then permanently removes the request and its lifecycle history. The owner may remove their own request; users with `MANAGE_REQUESTS` or `ADMIN` may remove any request.
      tags:
        - request
      parameters:
        - in: path
          name: requestId
          description: Request ID
          required: true
          schema:
            type: string
            example: '1'
      responses:
        '204':
          description: Request status entry and history removed
        '409':
          description: Active work could not be cleaned up safely
  /request/{requestId}/{status}:
    post:
      summary: Update a request's status
      description: |
        Updates a request's status to approved or declined. Also returns the request in a JSON object.

        Requires the `MANAGE_REQUESTS` permission or `ADMIN`.
      tags:
        - request
      parameters:
        - in: path
          name: requestId
          description: Request ID
          required: true
          schema:
            type: string
            example: '1'
        - in: path
          name: status
          description: New status
          required: true
          schema:
            type: string
            enum: [approve, decline]
      responses:
        '200':
          description: Request status changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaRequest'
        '400':
          description: Status must be approve or decline
        '409':
          description: Only pending requests can be approved or declined
