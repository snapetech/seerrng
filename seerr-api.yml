    get:
      summary: Returns blocklisted items
      description: Returns list of all blocklisted media
      tags:
        - blocklist
      parameters:
        - in: query
          name: take
          schema:
            type: number
            nullable: true
            example: 25
        - in: query
          name: skip
          schema:
            type: number
            nullable: true
            example: 0
        - in: query
          name: search
          schema:
            type: string
            nullable: true
            example: dune
        - in: query
          name: filter
          schema:
            type: string
            enum: [all, manual, blocklistedTags]
            default: all
        - in: query
          name: timeFrame
          schema:
            type: string
            enum: [all, 7d, 14d, 30d, 6m]
            default: all
        - in: query
          name: mediaType
          schema:
            type: string
            enum: [all, movie, tv, music, book, comic, magazine]
            default: all
        - in: query
          name: sort
          schema:
            type: string
            enum: [date, title, mediaType]
            default: date
        - in: query
          name: sortDirection
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Blocklisted items returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
                  counts:
                    type: object
                    required: [all, manual, blocklistedTags]
                    properties:
                      all:
