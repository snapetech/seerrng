      tags:
        - settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ServarrConnectionSettings'
                - type: object
                  properties:
                    activeDirectory:
                      type: string
                    activeProfileId:
                      type: number
                    activeMetadataProfileId:
                      type: number
                    term:
                      type: string
                      example: isbn:9780547928227
                    testAdd:
                      type: boolean
                      default: false
      responses:
        '200':
          description: Bookshelf diagnostic result
          content:
            application/json:
              schema:
                type: object
                required: [ok, category, message]
                properties:
                  ok:
                    type: boolean
                  category:
                    type: string
                    enum:
                      - ok
                      - backend_unreachable
                      - lookup_empty
                      - lookup_incomplete
                      - backend_add_rejected
                  message:
                    type: string
                  term:
                    type: string
                  provider:
                    type: string
                    enum:
                      - hardcover
                      - softcover
                      - unknown
                  legacyWarning:
                    type: string
                  metadataSource:
                    type: string
                  lookupCount:
                    type: number
  /settings/readarr/{readarrId}/media-move/configuration:
    get:
      summary: List Bookshelf library details for a path move
      description: Admin-only. Reads authors and accessible root folders from one Bookshelf instance. It does not merge separate Bookshelf databases.
      tags:
        - settings
      parameters:
        - in: path
          name: readarrId
          required: true
          schema:
            type: integer
        - in: query
          name: format
          required: true
          schema:
            type: string
            enum: [ebook, audiobook]
      responses:
        '200':
          description: Bookshelf library and accessible destination folders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookshelfMediaMoveConfiguration'
        '400':
          description: Unsupported format
        '403':
          description: Administrator permission required
        '409':
          description: BookshelfNG does not support this operation
        '502':
          description: Bookshelf library details could not be loaded
  /settings/readarr/{readarrId}/media-move/preview:
    post:
      summary: Preview a bulk Bookshelf media path move
      description: Admin-only. Returns file paths, conflicts, missing files, and space estimates for selected authors in one Bookshelf instance. The preview token expires when the underlying move inputs change.
      tags:
        - settings
      parameters:
        - in: path
          name: readarrId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookshelfMediaMovePreviewRequest'
      responses:
        '200':
          description: Fresh batch preview and preview token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookshelfMediaMoveBatchPreview'
        '400':
          description: Invalid selection, source folder, or destination
        '403':
          description: Administrator permission required
        '409':
          description: BookshelfNG does not support this operation
        '502':
          description: BookshelfNG could not produce a preview
  /settings/readarr/{readarrId}/media-move/start:
    post:
      summary: Start a previewed bulk Bookshelf media path move
      description: Admin-only. Requires the preview token and queues the move in the selected Bookshelf instance. Preview again if the library changes.
      tags:
        - settings
      parameters:
        - in: path
          name: readarrId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookshelfMediaMoveStartRequest'
      responses:
        '202':
          description: BookshelfNG accepted the move command
          content:
            application/json:
              schema:
                type: object
                required: [command]
                properties:
                  command:
                    $ref: '#/components/schemas/BookshelfMediaMoveCommand'
        '400':
          description: Invalid move request or missing preview token
        '403':
          description: Administrator permission required
        '409':
          description: Preview is stale, destination changed, or BookshelfNG lacks move support
        '502':
          description: BookshelfNG could not start the move
  /settings/readarr/{readarrId}/media-move/commands/{commandId}:
    get:
      summary: Read a Bookshelf media move command
      description: Admin-only. Returns the queued move command status from the selected Bookshelf instance.
      tags:
        - settings
      parameters:
        - in: path
          name: readarrId
          required: true
