  /readmeabook/requests:
    get:
      summary: Get the signed-in user's ReadMeABook requests
      tags: [books]
      responses:
        '200':
          description: Audiobook requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReadMeABookRequest'
    post:
      summary: Request an audiobook through ReadMeABook
      tags: [books]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asin, title, author]
              properties:
                asin:
                  type: string
                  pattern: '^[A-Za-z0-9]{10}$'
                title:
                  type: string
                  maxLength: 512
                author:
                  type: string
                  maxLength: 512
                narrator:
                  type: string
                  maxLength: 512
                description:
                  type: string
                  maxLength: 8000
                coverArtUrl:
                  type: string
                  format: uri
                durationMinutes:
                  type: integer
                  minimum: 1
                  maximum: 100000
      responses:
        '201':
          description: Audiobook request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadMeABookRequest'
        '400':
          description: Invalid audiobook
        '403':
          description: The user cannot request books
        '409':
          description: The audiobook is already requested
        '429':
          description: Book quota reached
  /readmeabook/requests/{id}:
