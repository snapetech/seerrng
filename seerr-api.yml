                      $ref: '#/components/schemas/MediaInfo'
  /media/{mediaId}:
    delete:
      summary: Delete media item
      description: Removes a media item. The `MANAGE_REQUESTS` permission is required to perform this action.
      tags:
        - media
      parameters:
        - in: path
          name: mediaId
          description: Media ID
          required: true
          example: '1'
          schema:
            type: string
      responses:
        '204':
          description: Succesfully removed media item
  /media/{mediaId}/library:
    parameters:
      - in: path
        name: mediaId
        required: true
        schema:
          type: string
    get:
      summary: Resolve all verified library copies
      description: Read-only inventory across configured services. Requires MANAGE_REQUESTS. Returns a confirmation token bound to the exact media, targets and service configuration. No default-service guessing or deletion.
      tags: [media]
      responses:
        '200':
          description: Verified library copies and confirmation token
          content:
            application/json:
              schema:
                type: object
                required: [targets, token]
                properties:
                  token:
                    type: string
                  targets:
                    type: array
                    items:
                      type: object
                      required:
                        [
                          key,
                          serviceId,
                          serviceType,
                          externalId,
                          service,
                          quality,
                          url,
                        ]
                      properties:
                        key:
                          type: string
                        serviceId:
                          type: integer
                        serviceType:
                          type: string
                          enum: [radarr, sonarr, lidarr, readarr]
                        externalId:
                          type: integer
                        service:
                          type: string
                        quality:
                          type: string
                        url:
                          type: string
        '403':
          description: Not authorized
        '404':
          description: Media not found
        '502':
          description: Could not verify the complete library scope
    delete:
      summary: Delete all confirmed library copies
      description: Requires MANAGE_REQUESTS. Revalidates the exact confirmation scope before deleting files and entries from every listed service. Stops on failure and preserves requests, issues, other titles, authors and artists.
      tags: [media]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  type: string
                  pattern: '^[a-f0-9]{64}$'
      responses:
        '204':
          description: All confirmed copies removed
        '400':
          description: Missing or invalid confirmation
        '403':
          description: No longer authorized
        '404':
          description: Media not found
        '409':
          description: Scope changed or deletion failed; review refreshed state
        '502':
          description: Could not verify services before deletion
  /media/{mediaId}/file:
    delete:
      summary: Delete media file
      description: Removes a media file from radarr/sonarr. The `ADMIN` permission is required to perform this action.
      tags:
        - media
      parameters:
        - in: path
          name: mediaId
          description: Media ID
          required: true
          example: '1'
          schema:
            type: string
        - in: query
          name: is4k
          description: Whether to remove from 4K service instance (true) or regular service instance (false)
          required: false
          example: false
          schema:
            type: boolean
        - in: query
          name: format
          description: Book format to remove (ebook, audiobook, or both)
          required: false
          example: audiobook
          schema:
            type: string
            enum: [ebook, audiobook, both]
      responses:
        '204':
          description: Successfully removed media item
  /media/{mediaId}/{status}:
    post:
      summary: Update media status
      description: Updates a media item's status and returns the media in JSON format
      tags:
        - media
      parameters:
        - in: path
          name: mediaId
          description: Media ID
          required: true
          example: '1'
          schema:
            type: string
        - in: path
          name: status
          description: New status
          required: true
          example: available
          schema:
            type: string
            enum: [available, partial, processing, pending, unknown, deleted]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                is4k:
                  type: boolean
                  example: false
                  description: |
                    When true, updates the 4K status field (status4k).
                    When false or not provided, updates the regular status field (status).
                    This applies to all status values (available, partial, processing, pending, unknown).
      responses:
        '200':
          description: Returned media
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaInfo'
