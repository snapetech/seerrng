  /settings/prowlarr:
    get:
      summary: Get Prowlarr connection settings
      description: Returns the Prowlarr connection and category mapping. The API key is always redacted.
      tags:
        - settings
      responses:
        '200':
          description: Prowlarr settings returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  hostname:
                    type: string
                  port:
                    type: integer
                  useSsl:
                    type: boolean
                  baseUrl:
                    type: string
                  apiKey:
                    type: string
                    description: Redacted when a key is saved.
                  apiKeyConfigured:
                    type: boolean
                  categoryMappings:
                    $ref: '#/components/schemas/ProwlarrCategoryMappings'
    put:
      summary: Update Prowlarr connection settings
      description: Saves the Prowlarr address, API key, and per-medium category filters. The API key remains server-side.
      tags:
        - settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostname, port, useSsl, baseUrl, categoryMappings]
              properties:
                hostname:
                  type: string
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                useSsl:
                  type: boolean
                baseUrl:
                  type: string
                apiKey:
                  type: string
                clearApiKey:
                  type: boolean
                categoryMappings:
                  $ref: '#/components/schemas/ProwlarrCategoryMappings'
      responses:
        '200':
          description: Prowlarr settings updated
        '400':
          description: Invalid Prowlarr settings
  /settings/prowlarr/test:
    post:
      summary: Test a Prowlarr connection
      description: Checks Prowlarr connectivity and category coverage, then tests each enabled searchable indexer with bounded concurrency. Tests contact the indexer but do not grab or download releases. The submitted connection settings are not saved. Omit apiKey to use the saved key. Requires administrator permission.
      tags:
        - settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostname, port, useSsl]
              properties:
                hostname:
                  type: string
                port:
                  type: integer
                useSsl:
                  type: boolean
                baseUrl:
                  type: string
                apiKey:
                  type: string
                categoryMappings:
                  $ref: '#/components/schemas/ProwlarrCategoryMappings'
      responses:
        '200':
          description: Prowlarr management connection, indexer coverage, and per-indexer test results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProwlarrInventory'
        '400':
          description: Invalid Prowlarr settings
        '502':
          description: Prowlarr management API unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  diagnostics:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProwlarrIndexerDiagnostic'
  /settings/prowlarr/coverage:
    get:
      summary: Get Prowlarr indexer coverage
      description: Returns enabled searchable indexers and the categories they advertise. This does not confirm grabs or imports.
      tags:
        - settings
      responses:
        '200':
          description: Prowlarr coverage returned, or not configured
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [configured]
                    properties:
                      configured:
                        type: boolean
                        enum: [false]
                  - allOf:
                      - type: object
                        required: [configured]
                        properties:
                          configured:
                            type: boolean
                            enum: [true]
                      - $ref: '#/components/schemas/ProwlarrInventory'
        '502':
          description: Prowlarr inventory unavailable
  /indexer-search/configuration:
    get:
      summary: Get direct indexer search availability
      description: Returns whether Prowlarr is configured and the selected category IDs. Requires Manage Requests permission.
      tags:
        - indexer search
      responses:
        '200':
          description: Prowlarr search configuration returned
          content:
            application/json:
              schema:
                type: object
                required: [configured, categories]
                properties:
                  configured:
                    type: boolean
                  categories:
                    type: array
                    items:
                      type: object
                      required: [category, categoryIds]
                      properties:
                        category:
                          type: string
                          enum:
                            [
                              movie,
                              tv,
                              music,
                              ebook,
                              audiobook,
                              comic,
                              magazine,
                              retro,
                              modern,
                              game,
                            ]
                        categoryIds:
                          $ref: '#/components/schemas/ProwlarrCategoryIds'
  /indexer-search/search:
    post:
      summary: Search Prowlarr indexers
      description: Runs a bounded manual release search in Prowlarr for a SeerrNG medium. Results are informational and are not grabbed or imported.
      tags:
        - indexer search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, query]
              properties:
                category:
                  type: string
                  enum:
                    [
                      movie,
                      tv,
                      music,
                      ebook,
                      audiobook,
                      comic,
                      magazine,
                      retro,
                      modern,
                      game,
                    ]
                query:
                  type: string
                  minLength: 2
                  maxLength: 256
                offset:
                  type: integer
                  minimum: 0
                  maximum: 2000
                  multipleOf: 50
      responses:
        '200':
          description: Prowlarr results returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProwlarrSearchResultsResponse'
        '400':
          description: Invalid search input
        '409':
          description: Prowlarr is not configured for this category
        '429':
          description: Search rate limit reached
        '502':
          description: Prowlarr search failed
