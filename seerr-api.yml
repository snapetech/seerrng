  /collection/{collectionId}/availability:
    post:
      summary: Check indexed collection members and linked media-server collections
      description: Performs bounded identity lookups and additive synchronization of explicitly managed collections. Does not scan media files or create collections.
      tags: [collection]
      parameters:
        - in: path
          name: collectionId
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 1000000000
      responses:
        '200':
          description: Fresh availability and collection destinations (destinations are admin-only)
          content:
            application/json:
              schema:
                type: object
                properties:
                  collection:
                    $ref: '#/components/schemas/Collection'
                  sync:
                    type: object
        '503':
          description: Media server could not be verified; cached availability must be retained
  /collection/{collectionId}/server:
    post:
      summary: Add a collection to Plex, Jellyfin or Emby
      description: Admin-only. Creates missing collections from selected indexed members. Selection applies to creation only; newly available members are added automatically. Existing unrelated collections are not modified.
      tags: [collection]
      parameters:
        - in: path
          name: collectionId
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 1000000000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [libraryIds]
              additionalProperties: false
              properties:
                selectedIds:
                  description: Initial member selection only, not a filter for automatic updates. Omit to select all.
                  type: array
                  minItems: 1
                  maxItems: 500
                  uniqueItems: true
                  items:
                    type: string
                    pattern: '^[1-9]\d{0,9}$'
                libraryIds:
                  type: array
                  minItems: 1
                  maxItems: 50
                  uniqueItems: true
                  items:
                    type: string
                    pattern: '^[a-zA-Z0-9-]{1,128}$'
      responses:
        '200':
          description: Per-library result; unknown destinations may require a later retry
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Administrator permission required
        '503':
          description: Unable to verify the media server
    delete:
      summary: Remove a collection without deleting media
      description: Admin-only. Rechecks each confirmed remote collection identity, stops automatic updates, and removes the collection container only. Movies and media files are preserved.
      tags: [collection]
      parameters:
        - in: path
          name: collectionId
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 1000000000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destinations]
              additionalProperties: false
              properties:
                destinations:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    additionalProperties: false
                    required: [libraryId, removalToken]
                    properties:
                      libraryId:
                        type: string
                        pattern: '^[a-zA-Z0-9-]{1,128}$'
                      removalToken:
                        type: string
                        pattern: '^[a-f0-9]{64}$'
      responses:
        '200':
          description: Verified removal result per destination
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid confirmation
        '403':
          description: Administrator permission required
        '503':
          description: Collection identity or removal could not be verified
