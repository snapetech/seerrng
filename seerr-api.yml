      description: Returns stable layout and personalized-state revisions. Row descriptor revisions do not track upstream catalog content.
      tags:
        - discover
      responses:
        '200':
          description: Discover homepage manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverHomeManifest'
        '304':
          description: Manifest revisions are unchanged
  /discover/home/state:
    post:
      summary: Get personalized state for a bounded set of Discover items
      tags:
        - discover
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - items
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    oneOf:
                      - type: object
                        additionalProperties: false
                        required: [mediaType, id]
                        properties:
                          mediaType:
                            type: string
                            enum: [movie, tv]
                          id:
                            type: integer
                            minimum: 1
                            maximum: 1000000000
                      - type: object
                        additionalProperties: false
                        required: [mediaType, id]
                        properties:
                          mediaType:
                            type: string
                            enum: [music, book]
                          id:
                            type: string
                            minLength: 1
                            maxLength: 128
      responses:
        '200':
          description: Personalized media, request, and watchlist state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverHomeState'
        '400':
          description: Invalid item list
  /discover/movies:
    get:
      summary: Discover movies
      description: Returns a list of movies in a JSON object.
      tags:
        - search
      parameters:
        - in: query
          name: page
          schema:
            type: number
            example: 1
            default: 1
        - in: query
          name: language
          schema:
            type: string
            example: en
        - in: query
          name: search
          description: Searches movie titles instead of using structured discovery filters
          schema:
            type: string
            maxLength: 256
            example: Star Trek
        - in: query
          name: availability
          description: Selects the client-side scanned library quality view
          schema:
            type: string
            enum: [hd, 4k]
        - in: query
          name: genre
          schema:
            type: string
            example: 18
        - in: query
          name: studio
          schema:
            type: number
            example: 1
        - in: query
          name: keywords
          schema:
            type: string
            example: 1,2
        - in: query
          name: excludeKeywords
          schema:
            type: string
            example: 3,4
          description: Comma-separated list of keyword IDs to exclude from results
        - in: query
          name: sortBy
          schema:
            type: string
            example: popularity.desc
        - in: query
          name: primaryReleaseDateGte
          schema:
            type: string
            example: 2022-01-01
        - in: query
          name: primaryReleaseDateLte
          schema:
            type: string
            example: 2023-01-01
        - in: query
          name: withRuntimeGte
          schema:
            type: number
            example: 60
        - in: query
          name: withRuntimeLte
          schema:
            type: number
            example: 120
        - in: query
          name: voteAverageGte
          schema:
            type: number
            example: 7
        - in: query
          name: voteAverageLte
          schema:
            type: number
            example: 10
        - in: query
          name: voteCountGte
          schema:
            type: number
            example: 7
        - in: query
          name: voteCountLte
          schema:
            type: number
            example: 10
        - in: query
          name: watchRegion
          schema:
            type: string
            example: US
        - in: query
          name: watchProviders
          schema:
            type: string
            example: 8|9
        - in: query
          name: certification
          schema:
            type: string
            example: PG-13
          description: Exact certification to filter by (used when certificationMode is 'exact')
        - in: query
          name: certificationGte
          schema:
            type: string
            example: G
          description: Minimum certification to filter by (used when certificationMode is 'range')
        - in: query
          name: certificationLte
          schema:
            type: string
            example: PG-13
          description: Maximum certification to filter by (used when certificationMode is 'range')
        - in: query
          name: certificationCountry
          schema:
            type: string
            example: US
          description: Country code for the certification system (e.g., US, GB, CA)
        - in: query
          name: certificationMode
          schema:
            type: string
            enum: [exact, range]
            example: exact
          description: Determines whether to use exact certification matching or a certification range (internal use only, not sent to TMDB API)
        - in: query
          name: shuffleSeed
          schema:
            type: string
            maxLength: 128
            example: refresh-1
      responses:
        '200':
          description: Results
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: number
                    example: 1
                  totalPages:
                    type: number
                    example: 20
                  totalResults:
                    type: number
                    example: 200
                  stale:
                    type: boolean
                    description: True when saved results are served because TMDB is unavailable.
                  results:
                    type: array
                    items:
