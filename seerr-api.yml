  /calendar:
    get:
      summary: Browse releases for your requests and shared acquisition services
      tags:
        - discover
      parameters:
        - name: start
          in: query
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
        - name: end
          in: query
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
        - name: scope
          in: query
          schema:
            type: string
            enum:
              - mine
              - all
            default: mine
        - name: mediaType
          in: query
          schema:
            type: string
            enum:
              - movie
              - tv
              - music
              - book
              - comic
              - magazine
              - software
        - name: includeUnmonitored
          in: query
          schema:
            type: boolean
            default: false
        - name: timeZone
          in: query
          schema:
            type: string
            maxLength: 64
            default: UTC
          description: >-
            IANA time zone for episode month boundaries; all-day movie, album, book, comic, magazine, and game releases retain their calendar dates.
      responses:
        '200':
          description: Release calendar with unavailable sources indicated
          content:
            application/json:
              schema:
                type: object
                required:
                  - results
                  - partialSources
                  - truncated
                properties:
                  results:
                    type: array
                    maxItems: 5000
                    items:
                      type: object
                      required:
                        - id
                        - source
                        - mediaType
                        - title
                        - startsAt
                        - dateType
                        - allDay
                        - available
                        - is4k
                      properties:
                        id:
                          type: string
                        source:
                          type: string
                          enum:
                            - radarr
                            - sonarr
                            - lidarr
                            - readarr
                            - mylar
                            - kapowarr
                            - lazylibrarian
                            - questarr
                            - romarr
                        mediaType:
                          type: string
                          enum:
                            - movie
                            - tv
                            - music
                            - book
                            - comic
                            - magazine
                            - software
                        title:
                          type: string
                        startsAt:
                          type: string
                          format: date-time
                        dateType:
                          type: string
                          enum:
                            - air
                            - digital
                            - physical
                            - theatrical
                            - album
                            - book
                            - issue
                            - game
                        allDay:
                          type: boolean
                        tmdbId:
                          type: integer
                        tvdbId:
                          type: integer
                        mbId:
                          type: string
                        artistName:
                          type: string
                        bookId:
                          type: string
                          description: Service-scoped Bookshelf ID suitable for the book details route.
                        foreignBookId:
                          type: string
                          description: Provider-native Readarr-compatible book identity used for personal request matching.
                        foreignEditionId:
                          type: string
                          description: Provider-native edition identity used for personal request matching.
                        isbnCandidates:
                          type: array
                          maxItems: 24
                          items:
                            type: string
                          description: Public ISBN identities available from Readarr book editions, used for matching personal requests.
                        bookFormat:
                          type: string
                          enum:
                            - ebook
                            - audiobook
                        authorName:
                          type: string
                        comicId:
                          type: string
                          description: ComicVine identity suitable for the comic details route.
                        magazineTitle:
                          type: string
                          description: LazyLibrarian magazine title suitable for the magazine details route.
                        issueNumber:
                          type: string
                        softwareCategory:
                          type: string
                          enum:
                            - game
                            - retro
                            - modern
                        igdbId:
                          type: integer
                        platformName:
                          type: string
                          description: Requested PC target or emulation system.
                        seasonNumber:
                          type: integer
                        episodeNumber:
                          type: integer
                        episodeTitle:
                          type: string
                        available:
                          type: boolean
                        is4k:
                          type: boolean
                        dateChanges:
                          type: array
                          maxItems: 3
                          description: Recent provider date or air-time changes captured by the background calendar history job.
                          items:
                            type: object
                            required:
                              - previousStartsAt
                              - startsAt
                              - changedAt
                              - previousAllDay
                              - allDay
                            properties:
                              previousStartsAt:
                                type: string
                                format: date-time
                              startsAt:
                                type: string
                                format: date-time
                              changedAt:
                                type: string
                                format: date-time
                              previousAllDay:
                                type: boolean
                              allDay:
                                type: boolean
                  partialSources:
                    type: array
                    items:
                      type: object
                      properties:
                        source:
                          type: string
                        serverId:
                          type: integer
                  truncated:
                    type: boolean
        '400':
          description: Invalid calendar range or filters
        '403':
          description: Calendar scope not permitted
        '502':
          description: Calendar unavailable

