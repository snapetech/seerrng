          name: tvId
          required: true
          schema:
            type: number
            example: 76479
        - in: query
          name: page
          schema:
            type: number
            example: 1
            default: 1
        - in: query
          name: language
          schema:
            type: string
            example: en
        - in: query
          name: shuffleSeed
          schema:
            type: string
            maxLength: 128
            example: refresh-1
      responses:
        '200':
          description: List of TV series
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: number
                    example: 1
                  totalPages:
                    type: number
                    example: 20
                  totalResults:
                    type: number
                    example: 200
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/TvResult'
  /tv/{tvId}/ratings:
    get:
      summary: Get TV ratings
      description: Returns ratings based on provided tvId in a JSON object.
      tags:
        - tv
      parameters:
        - in: path
          name: tvId
          required: true
          schema:
            type: number
            example: 76479
      responses:
        '200':
          description: Ratings returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                    example: The Boys
                  year:
                    type: number
                    example: 2019
                  url:
                    type: string
                    example: 'http://www.rottentomatoes.com/m/mulan_2020/'
                  criticsScore:
                    type: number
                    example: 85
                  criticsRating:
                    type: string
                    enum: ['Rotten', 'Fresh']
  /tv/ratings/mdblist/batch:
    post:
      summary: Get MDBList TV ratings for a batch
      description: Looks up MDBList ratings for up to 200 TMDB series IDs and primes the shared title-rating cache.
      tags:
        - tv
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MdblistRatingBatchRequest'
      responses:
        '200':
          description: Available ratings keyed by TMDB series ID. Titles without ratings are omitted.
          content:
