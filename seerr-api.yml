          description: Invalid or nonexistent user
    post:
      summary: Save the current user's Series detail disclosure order
      description: Self-only authenticated operation, protected by the application's cookie and CSRF middleware. Overview defaults first when absent; other missing roles are appended in their default order. Explicitly saved placements and the relative order of existing roles are preserved.
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [order]
              properties:
                order:
                  type: array
                  maxItems: 6
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                      [cast, crew, subjectTags, details, mediaServer, overview]
      responses:
        '200':
          description: Saved normalized disclosure order
          content:
            application/json:
              schema: *detailDisclosureOrder
        '400':
          description: Invalid media category or order
        '403':
          description: Not the current authenticated user
        '404':
          description: Invalid or nonexistent user
        '500':
          description: Disclosure order could not be saved
