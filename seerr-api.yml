openapi: '3.0.2'
info:
  title: 'Seerr API'
  version: '1.0.0'
  description: |
    This is the documentation for the Seerr API backend.

    Two primary authentication methods are supported:

    - **Cookie Authentication**: A valid sign-in to the `/auth/plex` or `/auth/local` will generate a valid authentication cookie.
    - **API Key Authentication**: Sign-in is also possible by passing an `X-Api-Key` header along with a valid API Key generated by Seerr.
tags:
  - name: public
    description: Public API endpoints requiring no authentication.
  - name: settings
    description: Endpoints related to Seerr's settings and configuration.
  - name: live-tv
    description: Live TV airings and recording requests through IPTV Tunerr.
  - name: soulseek
    description: Soulseek track requests, library-health fixes, and SongID through slskdN.
  - name: swipe
    description: Swipe discovery decks and swipe decisions.
  - name: auth
    description: Endpoints related to logging in or out, and the currently authenticated user.
  - name: users
    description: Endpoints related to user management.
  - name: search
    description: Endpoints related to search and discovery.
  - name: admin
    description: Administrator-managed instance-wide configuration and tools.
  - name: request
    description: Endpoints related to request management.
  - name: movies
    description: Endpoints related to retrieving movies and their details.
  - name: tv
    description: Endpoints related to retrieving TV series and their details.
  - name: other
    description: Endpoints related to other TMDB data
  - name: person
    description: Endpoints related to retrieving person details.
  - name: media
    description: Endpoints related to media management.
  - name: collection
    description: Endpoints related to retrieving collection details.
  - name: service
    description: Endpoints related to getting service (Radarr/Sonarr) details.
  - name: watchlist
    description: Collection of media to watch later
  - name: blocklist
    description: Blocklisted media from discovery page.
  - name: association
    description: Cross-medium related media graph endpoints.
  - name: playlist
    description: Endpoints for importing Spotify and YouTube playlists as music requests.
  - name: game library
    description: Personal game progress, optional household sharing, and Steam library import.
  - name: native desktop
    description: Optional protocol-v1 Jellyfin playback for compatible native desktop clients.
  - name: indexer search
    description: Direct manual searches through an administrator-configured Prowlarr instance.
servers:
  - url: '{server}/api/v1'
    variables:
      server:
        default: http://localhost:5055

components:
  schemas:
    SwipeCard:
      type: object
      properties:
        mediaType:
          type: string
          enum: [movie, tv, book]
        id:
          type: string
        title:
          type: string
        subtitle:
          type: string
        year:
          type: integer
        overview:
          type: string
        imageUrl:
          type: string
        rating:
          type: number
        authorId:
          type: string
        because:
          type: string
          description: Why the card is in the deck, for example a liked title.
        reason:
          type: string
          description: AI explanation when an AI provider ranked the deck.
    SwipeSettings:
      type: object
      properties:
        enabled:
          type: boolean
        aiProvider:
          type: string
          enum: [none, anthropic, openai]
        aiApiKey:
          type: string
          description: API key for the selected AI provider (optional for local OpenAI-compatible servers). Omit or send the redacted value to keep the saved key.
        clearAiApiKey:
          type: boolean
        aiModel:
          type: string
          maxLength: 100
        aiBaseUrl:
          type: string
          maxLength: 2048
          description: OpenAI-compatible base URL for the `openai` provider, for example https://api.openai.com/v1 or http://ollama:11434/v1.
        aiEffort:
          type: string
          enum: [low, medium, high]
    SwipeFavoriteSeed:
      type: object
      required: [mediaType, id, title]
      properties:
        mediaType:
          type: string
          enum: [movie, tv, book]
        id:
          type: string
          maxLength: 64
        title:
          type: string
          maxLength: 512
    BookHomeSectionPreference:
      type: object
      required: [key, enabled]
      properties:
        key:
          type: string
          maxLength: 64
        enabled:
          type: boolean
    ReadMeABookSettings:
      type: object
      required: [enabled, hostname, port, useSsl, baseUrl, apiKey]
      properties:
        enabled:
          type: boolean
        hostname:
          type: string
          maxLength: 255
        port:
          type: integer
          minimum: 1
          maximum: 65535
        useSsl:
          type: boolean
        baseUrl:
          type: string
          maxLength: 512
        apiKey:
          type: string
          description: API token. The saved value is redacted in responses.
        apiKeyConfigured:
          type: boolean
        clearApiKey:
          type: boolean
    ReadMeABookRequest:
      type: object
      properties:
        id:
          type: integer
        asin:
          type: string
        title:
          type: string
        author:
          type: string
        narrator:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        coverArtUrl:
          type: string
          nullable: true
        durationMinutes:
          type: integer
          nullable: true
        status:
          type: string
        statusMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TrackRequest:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [pending, searching, completed, failed, declined, cancelled]
        artist:
          type: string
        title:
          type: string
        recordingMbid:
          type: string
        source:
          type: string
          enum: [manual, playlist, songid]
        searchCount:
          type: integer
        lastMatchCount:
          type: integer
        lastError:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        requestedBy:
          type: object
          properties:
            id:
              type: integer
            displayName:
              type: string
    SlskdnSettings:
      type: object
      properties:
        enabled:
          type: boolean
        hostname:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        useSsl:
          type: boolean
        baseUrl:
          type: string
        apiKey:
          type: string
          description: slskdN API key (read-write role; administrator for SongID). Omit or send the redacted value to keep the saved key.
        clearApiKey:
          type: boolean
        searchFilter:
          type: string
          maxLength: 512
    SongIdResult:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        summary:
          type: string
        stage:
          type: string
        percentComplete:
          type: number
        queuePosition:
          type: integer
        albums:
          type: array
          items:
            type: object
            properties:
              releaseId:
                type: string
              releaseGroupId:
                type: string
              title:
                type: string
              artist:
                type: string
              isExact:
                type: boolean
        tracks:
          type: array
          items:
            type: object
            properties:
              recordingId:
                type: string
              title:
                type: string
              artist:
                type: string
              isExact:
                type: boolean
    RecordingRequest:
      type: object
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [airing, series]
        status:
          type: string
          enum:
            [
              pending,
              scheduled,
              recording,
              completed,
              failed,
              declined,
              cancelled,
            ]
        title:
          type: string
        subTitle:
          type: string
        mediaType:
          type: string
          enum: [movie, tv]
        tmdbId:
          type: integer
        channel:
          type: string
          description: Tunerr guide number
        channelName:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        completedCount:
          type: integer
        failedCount:
          type: integer
        lastError:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        requestedBy:
          type: object
          properties:
            id:
              type: integer
            displayName:
              type: string
    LiveTvAiring:
      type: object
      properties:
        channel:
          type: string
        channelName:
          type: string
        start:
          type: string
          format: date-time
        stop:
          type: string
          format: date-time
        title:
          type: string
        subTitle:
          type: string
        season:
          type: integer
        episode:
          type: integer
        categories:
          type: array
          items:
            type: string
    TunerrSettings:
      type: object
      properties:
        enabled:
          type: boolean
        hostname:
          type: string
        useSsl:
          type: boolean
        baseUrl:
          type: string
        deckPort:
          type: integer
          minimum: 1
          maximum: 65535
        tunerPort:
          type: integer
          minimum: 1
          maximum: 65535
        guideUrl:
          type: string
        username:
          type: string
        password:
          type: string
          description: Tunerr deck password. Omit or send the redacted value to keep the saved password.
        clearPassword:
          type: boolean
        guideHours:
          type: integer
          minimum: 6
          maximum: 336
    DownloadClientSettings:
      type: object
      required: [name, type, hostname]
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 80
        type:
          type: string
          enum: [qbittorrent, transmission, deluge, torrentng]
        enabled:
          type: boolean
        hostname:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        useSsl:
          type: boolean
        baseUrl:
          type: string
        username:
          type: string
        password:
          type: string
          description: Client password, Deluge Web UI password, or TorrentNG API token. Omit or send the redacted value to keep the saved secret.
        clearPassword:
          type: boolean
    LiveDownloadSettings:
      type: object
      properties:
        pollIntervalSeconds:
          type: integer
          minimum: 1
          maximum: 60
        clients:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/DownloadClientSettings'
    ReaderDeliverySettings:
      type: object
      required:
        [
          grimmoryUrl,
          grimmoryUsername,
          grimmoryPassword,
          bookorbitUrl,
          bookorbitUsername,
          bookorbitPassword,
          preferredProvider,
        ]
      properties:
        grimmoryUrl:
          type: string
          maxLength: 2048
        grimmoryUsername:
          type: string
          maxLength: 256
        grimmoryPassword:
          type: string
          maxLength: 2048
          description: Responses always redact configured passwords. Send the redacted marker to preserve a saved password.
        bookorbitUrl:
          type: string
          maxLength: 2048
        bookorbitUsername:
          type: string
          maxLength: 256
        bookorbitPassword:
          type: string
          maxLength: 2048
          description: Responses always redact configured passwords. Send the redacted marker to preserve a saved password.
        preferredProvider:
          type: string
          enum: [grimmory, bookorbit]
        clearGrimmoryCredentials:
          type: boolean
          description: Set true to remove the saved Grimmory username and password.
        clearBookorbitCredentials:
          type: boolean
          description: Set true to remove the saved BookOrbit username and password.
    ReaderGroupingTarget:
      type: object
      additionalProperties: false
      required: [type, id, name]
      properties:
        type:
          type: string
          enum: [author, book-series, comic-series]
        id:
          type: string
          minLength: 1
          maxLength: 255
        name:
          type: string
          minLength: 1
          maxLength: 255
    ReaderGroupingRule:
      type: object
      required: [field, operator, value]
      properties:
        field:
          type: string
        operator:
          type: string
        value:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
    ReaderGroupingFilter:
      type: object
      required: [type, join, rules]
      properties:
        type:
          type: string
          enum: [group]
        join:
          type: string
          enum: [and, AND]
        rules:
          type: array
          items:
            $ref: '#/components/schemas/ReaderGroupingRule'
    ReaderDeliveryGrouping:
      type: object
      required:
        [
          id,
          provider,
          targetType,
          targetId,
          targetName,
          groupName,
          remoteGroupId,
          isPublic,
          syncToKobo,
          status,
          lastMatchCount,
          countVerified,
          lastError,
          lastSyncedAt,
          serviceUrl,
        ]
      properties:
        id:
          type: integer
          minimum: 1
        provider:
          type: string
          enum: [grimmory, bookorbit]
        targetType:
          type: string
          enum: [author, book-series, comic-series]
        targetId:
          type: string
        targetName:
          type: string
        groupName:
          type: string
        remoteGroupId:
          type: string
          nullable: true
        isPublic:
          type: boolean
        syncToKobo:
          type: boolean
        status:
          type: string
          enum: [pending, ready, error]
        lastMatchCount:
          type: integer
          minimum: 0
        countVerified:
          type: boolean
        lastError:
          type: string
          nullable: true
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
        serviceUrl:
          type: string
          format: uri
          nullable: true
    ReaderGroupingPreviewRequest:
      type: object
      additionalProperties: false
      required: [provider, target]
      properties:
        provider:
          type: string
          enum: [grimmory, bookorbit]
        target:
          $ref: '#/components/schemas/ReaderGroupingTarget'
    ReaderGroupingPreview:
      type: object
      required:
        [provider, target, rule, ruleSummary, matchedCount, sampleTitles]
      properties:
        provider:
          type: string
          enum: [grimmory, bookorbit]
        target:
          $ref: '#/components/schemas/ReaderGroupingTarget'
        rule:
          $ref: '#/components/schemas/ReaderGroupingFilter'
        ruleSummary:
          type: string
        matchedCount:
          type: integer
          minimum: 0
        sampleTitles:
          type: array
          maxItems: 5
          items:
            type: string
    ReaderGroupingSaveRequest:
      type: object
      additionalProperties: false
      required: [provider, target]
      properties:
        provider:
          type: string
          enum: [grimmory, bookorbit]
        target:
          $ref: '#/components/schemas/ReaderGroupingTarget'
        isPublic:
          type: boolean
        syncToKobo:
          type: boolean
        allowEmpty:
          type: boolean
          description: Must be true to create a rule when the current preview has no matches.
    ReaderGroupingSaveResponse:
      type: object
      required: [grouping, previewCount, sampleTitles, ruleSummary]
      properties:
        grouping:
          $ref: '#/components/schemas/ReaderDeliveryGrouping'
        previewCount:
          type: integer
          minimum: 0
        sampleTitles:
          type: array
          maxItems: 5
          items:
            type: string
        ruleSummary:
          type: string
        warning:
          type: string
    ReaderGroupingConnectionTest:
      type: object
      required: [connected, provider, existingGroupingCount]
      properties:
        connected:
          type: boolean
        provider:
          type: string
          enum: [grimmory, bookorbit]
        existingGroupingCount:
          type: integer
          minimum: 0
    ReaderGroupingDeleteResponse:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean
    GameLibraryEntry:
      type: object
      required:
        [
          id,
          externalKey,
          catalogId,
          category,
          title,
          status,
          isOwned,
          steamAppId,
          steamOwned,
          playtimeMinutes,
          storeName,
          platformName,
          shareWithHousehold,
          source,
          lastSyncedAt,
        ]
      properties:
        id:
          type: integer
          minimum: 1
        externalKey:
          type: string
        catalogId:
          type: integer
          nullable: true
        category:
          type: string
          enum: [game, retro, modern]
        title:
          type: string
        summary:
          type: string
        coverUrl:
          type: string
        releaseDate:
          type: string
        status:
          type: string
          enum: [backlog, playing, played, completed, paused, dropped]
        isOwned:
          type: boolean
        steamAppId:
          type: integer
          nullable: true
        steamOwned:
          type: boolean
        playtimeMinutes:
          type: integer
          minimum: 0
        storeName:
          type: string
        platformName:
          type: string
        shareWithHousehold:
          type: boolean
        source:
          type: string
          enum: [manual, steam]
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        request:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            status:
              type: string
    GameLibraryPage:
      type: object
      required: [total, nextOffset, results]
      properties:
        total:
          type: integer
        nextOffset:
          type: integer
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/GameLibraryEntry'
    SharedGameLibraryPage:
      type: object
      required: [total, nextOffset, results]
      properties:
        total:
          type: integer
        nextOffset:
          type: integer
          nullable: true
        results:
          type: array
          items:
            type: object
            required:
              [
                key,
                catalogId,
                category,
                title,
                owners,
                ownerCount,
                steamAppId,
                playtimeMinutes,
              ]
            properties:
              key:
                type: string
              catalogId:
                type: integer
                nullable: true
              category:
                type: string
                enum: [game, retro, modern]
              title:
                type: string
              summary:
                type: string
              coverUrl:
                type: string
              ownerCount:
                type: integer
              owners:
                type: array
                items:
                  type: object
                  required:
                    [
                      id,
                      displayName,
                      status,
                      storeName,
                      platformName,
                      playtimeMinutes,
                    ]
                  properties:
                    id:
                      type: integer
                    displayName:
                      type: string
                    avatar:
                      type: string
                    status:
                      type: string
                      enum:
                        [backlog, playing, played, completed, paused, dropped]
                    storeName:
                      type: string
                    platformName:
                      type: string
                    playtimeMinutes:
                      type: integer
                      minimum: 0
              steamAppId:
                type: integer
                nullable: true
              playtimeMinutes:
                type: integer
                minimum: 0
    GameLibraryMutation:
      type: object
      additionalProperties: false
      required: [category, catalogId]
      properties:
        category:
          type: string
          enum: [game, retro, modern]
        catalogId:
          type: integer
          minimum: 1
          maximum: 2147483647
        status:
          type: string
          enum: [backlog, playing, played, completed, paused, dropped]
        isOwned:
          type: boolean
        storeName:
          type: string
          maxLength: 120
        platformName:
          type: string
          maxLength: 120
        shareWithHousehold:
          type: boolean
    GameLibraryManualMutation:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        category:
          type: string
          enum: [game, retro, modern]
          default: game
        title:
          type: string
          minLength: 1
          maxLength: 512
        status:
          type: string
          enum: [backlog, playing, played, completed, paused, dropped]
        isOwned:
          type: boolean
        storeName:
          type: string
          maxLength: 120
        platformName:
          type: string
          maxLength: 120
        shareWithHousehold:
          type: boolean
    GameLibraryPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status:
          type: string
          enum: [backlog, playing, played, completed, paused, dropped]
        isOwned:
          type: boolean
        storeName:
          type: string
          maxLength: 120
        platformName:
          type: string
          maxLength: 120
        shareWithHousehold:
          type: boolean
    GameLibraryMutationResponse:
      type: object
      required: [entry]
      properties:
        entry:
          $ref: '#/components/schemas/GameLibraryEntry'
    GameLibraryErrorResponse:
      type: object
      additionalProperties: true
      properties:
        status:
          type: integer
        error:
          type: string
        message:
          type: string
    ExternalRequestList:
      type: object
      required: [id, provider, sourceUrl]
      properties:
        id:
          type: integer
        provider:
          type: string
          enum: [imdb, goodreads, hardcover]
        sourceUrl:
          type: string
          format: uri
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
        lastSyncError:
          type: string
          nullable: true
    ExternalRequestListSyncResult:
      type: object
      required:
        - listId
        - provider
        - sourceItems
        - requested
        - alreadyRequested
        - unmatched
        - failed
        - lastSyncedAt
      properties:
        listId:
          type: integer
        provider:
          type: string
          enum: [imdb, goodreads, hardcover]
        sourceItems:
          type: integer
        requested:
          type: integer
        alreadyRequested:
          type: integer
        unmatched:
          type: integer
        failed:
          type: integer
        lastSyncedAt:
          type: string
          format: date-time
        error:
          type: string
    SoftwareProviderSettingsInput:
      type: object
      properties:
        hostname:
          type: string
          maxLength: 255
        port:
          type: integer
          minimum: 1
          maximum: 65535
        useSsl:
          type: boolean
        baseUrl:
          type: string
          maxLength: 512
        apiKey:
          type: string
          maxLength: 2048
    SoftwareProviderSettingsView:
      type: object
      properties:
        hostname:
          type: string
        port:
          type: integer
        useSsl:
          type: boolean
        baseUrl:
          type: string
        apiKey:
          type: string
          description: Always redacted when configured.
        apiKeyConfigured:
          type: boolean
    SoftwareRequestActions:
      type: object
      nullable: true
      required: [retry, cancel]
      properties:
        retry:
          type: boolean
        cancel:
          type: boolean
        cancelReason:
          type: string
          nullable: true
    MediaRatings:
      type: object
      properties:
        rt:
          type: object
          properties:
            title:
              type: string
            year:
              type: number
            url:
              type: string
            criticsScore:
              type: number
            criticsRating:
              type: string
              enum: ['Rotten', 'Fresh', 'Certified Fresh']
            audienceScore:
              type: number
            audienceRating:
              type: string
              enum: ['Spilled', 'Upright']
        imdb:
          type: object
          properties:
            title:
              type: string
            url:
              type: string
            criticsScore:
              type: number
            criticsScoreCount:
              type: integer
        mdblist:
          type: object
          properties:
            imdbId:
              type: string
            imdbRating:
              type: number
            imdbVotes:
              type: integer
            rtRating:
              type: number
            rtUserRating:
              type: number
            metacriticRating:
              type: number
            traktRating:
              type: number
            traktVotes:
              type: integer
            tmdbRating:
              type: number
    MdblistRatingBatchRequest:
      type: object
      additionalProperties: false
      required:
        - ids
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: integer
            minimum: 1
            maximum: 1000000000
    MdblistRatings:
      type: object
      properties:
        imdbId:
          type: string
        imdbRating:
          type: number
        imdbVotes:
          type: integer
        rtRating:
          type: number
        rtUserRating:
          type: number
        metacriticRating:
          type: number
        traktRating:
          type: number
        traktVotes:
          type: integer
        tmdbRating:
          type: number
    MdblistRatingsBatchResponse:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/MdblistRatings'
    QueueIntervention:
      type: object
      additionalProperties: false
      required:
        - id
        - serviceType
        - serviceId
        - serviceName
        - title
        - warnings
        - state
        - resolution
        - actorId
        - manualImportCapable
        - createdAt
