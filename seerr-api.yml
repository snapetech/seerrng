                  totalPages:
                    type: number
                    example: 2
                  totalResults:
                    type: number
                    example: 20
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/MusicResult'
  /discover/books:
    get:
      summary: Discover books
      description: Returns book discovery results from Open Library, or audiobook narrator matches from configured Bookshelf catalogs.
      tags:
        - search
      parameters:
        - in: query
          name: page
          schema:
            type: number
            example: 1
            default: 1
        - in: query
          name: query
          schema:
            type: string
            example: subject:fiction
        - in: query
          name: author
          schema:
            type: string
            maxLength: 256
          description: Author terms sent to the book provider alongside the other search constraints.
        - in: query
          name: narrator
          schema:
            type: string
            maxLength: 256
          description: Audiobook-only narrator terms matched against populated Bookshelf narrator metadata. Only books in configured audiobook libraries can match.
        - in: query
          name: subject
          schema:
            type: string
            example: fiction
        - in: query
          name: format
          schema:
            type: string
            enum: [ebook, audiobook]
          description: Format context for book requests from this discovery view.
        - in: query
          name: sortBy
          schema:
            type: string
            enum:
              - ranked
              - ranked.asc
              - newest
              - oldest
              - random
              - rating
              - rating.asc
              - rating.desc
              - editions
              - editions.asc
              - trending
            default: ranked
        - in: query
          name: firstPublishYear
          schema:
            type: string
            maxLength: 16
            example: '2024'
        - in: query
          name: language
          schema:
            type: string
            maxLength: 3
            example: eng
        - in: query
          name: minRating
          schema:
            type: string
            maxLength: 3
            example: '4.0'
        - in: query
          name: shuffleSeed
          schema:
            type: string
            maxLength: 128
            example: refresh-1
        - in: query
          name: responseVersion
          description: Client response-contract version used to retire incompatible browser cache entries.
          schema:
            type: integer
            enum: [2, 3]
            default: 3
      responses:
        '200':
          description: Book discovery results
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: number
                    example: 1
                  totalPages:
                    type: number
                    example: 20
                  totalResults:
                    type: number
                    example: 200
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/BookResult'
  /discover/comics:
    get:
      summary: Discover comics
      description: Returns comic discovery results from ComicVine. Publisher, start-year, and issue-count filters use a durable local volume index; while its first scan runs, the response includes indexing progress and no filtered results. Empty if no ComicVine API key is configured.
      tags:
        - search
      parameters:
        - in: query
          name: page
          schema:
            type: number
            example: 1
            default: 1
        - in: query
          name: query
          schema:
            type: string
            example: Batman
        - in: query
          name: publisher
          schema:
            type: string
            maxLength: 128
        - in: query
          name: startYear
          schema:
            type: integer
            minimum: 1800
            maximum: 2200
        - in: query
          name: minIssues
          schema:
            type: integer
            minimum: 0
            maximum: 100000
        - in: query
          name: maxIssues
          schema:
            type: integer
            minimum: 0
            maximum: 100000
      responses:
        '200':
          description: Comic discovery results
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: number
                    example: 1
                  totalPages:
                    type: number
                    example: 20
                  totalResults:
                    type: number
                    example: 200
                  comicVineConfigured:
                    type: boolean
                    description: Whether a ComicVine API key is configured.
                  indexing:
                    type: boolean
                    description: True while the first complete filtered catalog index is building.
                  indexedResults:
                    type: integer
                    description: Volumes scanned so far when indexing is true.
                  expectedResults:
                    type: integer
                    description: ComicVine's reported volume count when indexing is true.
                  indexError:
                    type: string
                    nullable: true
                    description: A safe, non-secret code describing the most recent index retry.
                  lastIndexedAt:
                    type: integer
                    description: Unix timestamp of the last complete index used for filtered results.
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/ComicResult'
