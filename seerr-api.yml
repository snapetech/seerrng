          name: take
          schema:
            type: number
            nullable: true
            example: 20
        - in: query
          name: skip
          schema:
            type: number
            nullable: true
            example: 0
        - in: query
          name: sort
          schema:
            type: string
            enum: [added, modified, status]
            default: added
        - in: query
          name: sortDirection
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - in: query
          name: filter
          schema:
            type: string
            enum: [all, open, resolved]
            default: open
        - in: query
          name: requestedBy
          schema:
            type: number
            nullable: true
            example: 1
        - in: query
          name: timeFrame
          schema:
            type: string
            enum: [7d, 14d, 30d, 6m, all]
            default: all
        - in: query
          name: mediaType
          schema:
            type: string
            enum: [all, movie, tv, music, book, comic, magazine]
            default: all
        - in: query
          name: issueType
          schema:
            type: string
            enum: [all, audio, video, subtitle, other]
            default: all
        - in: query
          name: search
          schema:
            type: string
            nullable: true
            example: playback
      responses:
        '200':
          description: Issues returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Issue'
    post:
      summary: Create new issue
      description: |
        Creates a new issue
      tags:
        - issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                issueType:
                  type: number
                issueSubtype:
                  type: string
                  maxLength: 64
                  enum:
                    - missing_content
                    - missing_issue
                    - wrong_edition
                    - wrong_issue
                    - damaged_file
                    - incorrect_metadata
                    - other
                message:
                  type: string
                mediaId:
                  type: number
                problemSeason:
                  type: number
                  minimum: 0
                problemEpisode:
                  type: number
                  minimum: 0
                problemEpisodes:
                  type: array
                  maxItems: 500
                  items:
                    type: number
                    minimum: 1
                problemEpisodeSelections:
                  type: array
                  maxItems: 100
                  items:
                    $ref: '#/components/schemas/SeasonEpisodeSelection'
                is4k:
                  type: boolean
                userId:
                  type: number
                  nullable: true
      responses:
        '201':
          description: Succesfully created the issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'

