          description: Backend unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - candidateIds
                - importMode
                - fingerprint
              properties:
                candidateIds:
                  type: array
                  minItems: 1
                  maxItems: 50
                  uniqueItems: true
                  items:
                    type: integer
                    minimum: 1
                fingerprint:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                importMode:
                  type: string
                  enum:
                    - copy
                    - move
                targetId:
                  type: integer
                  minimum: 1
                  maximum: 2147483647

security:
  - cookieAuth: []
