  /search:
    get:
      summary: Search for movies, TV shows, people, music, books, authors, comics, and magazines
      description: Returns movies, TV shows, people, music albums, artists, books, authors, and comics from TMDB, MusicBrainz, ListenBrainz, Open Library, configured Bookshelf services, and ComicVine, plus magazine titles from configured LazyLibrarian catalogs.
      tags:
        - search
      parameters:
        - in: query
          name: query
          required: true
          schema:
            type: string
            example: 'Mulan'
        - in: query
          name: page
          schema:
            type: number
            example: 1
            default: 1
        - in: query
          name: language
          schema:
            type: string
            example: en
        - in: query
          name: type
          schema:
            type: string
            enum:
              - movie
              - tv
              - person
              - album
              - artist
              - book
              - author
              - music
              - comic
              - magazine
            description: Filter results by media type. When omitted, all types are returned.
        - in: query
          name: format
          schema:
            type: string
            enum:
              - ebook
              - audiobook
            description: Select the configured book service format. Valid only when type is book.
        - in: query
          name: resultFilter
          schema:
            type: string
            description: Refine music search results by album title while preserving the main search query.
        - in: query
          name: artist
          schema: { type: string, maxLength: 256 }
          description: Restrict Music results to the credited artist before pagination.
        - in: query
          name: artistId
          schema: { type: string, maxLength: 36 }
          description: Exact MusicBrainz artist identifier selected from autocomplete.
        - in: query
          name: genre
          schema: { type: string, maxLength: 256 }
        - in: query
          name: releaseType
          schema: { type: string, maxLength: 256 }
        - in: query
          name: primaryReleaseDateGte
          schema: { type: string, maxLength: 10 }
        - in: query
          name: primaryReleaseDateLte
          schema: { type: string, maxLength: 10 }
      responses:
        '200':
          description: Results
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: number
                    example: 1
                  totalPages:
                    type: number
                    example: 20
                  totalResults:
                    type: number
                    example: 200
                  results:
                    type: array
                    items:
                      anyOf:
                        - $ref: '#/components/schemas/MovieResult'
                        - $ref: '#/components/schemas/TvResult'
                        - $ref: '#/components/schemas/PersonResult'
                        - $ref: '#/components/schemas/MusicResult'
                        - $ref: '#/components/schemas/ArtistResult'
                        - $ref: '#/components/schemas/BookResult'
                        - $ref: '#/components/schemas/AuthorResult'
                        - $ref: '#/components/schemas/ComicResult'
                        - $ref: '#/components/schemas/MagazineResult'
  /search/keyword:
    get:
      summary: Search for keywords
      description: Returns a list of TMDB keywords matching the search query
      tags:
        - search
      parameters:
        - in: query
