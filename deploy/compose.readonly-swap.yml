services:
  seerrng:
    image: ghcr.io/snapetech/seerrng:${SEERRNG_TAG:-main}
    container_name: ${SEERRNG_CONTAINER_NAME:-seerrng-readonly}
    restart: unless-stopped
    init: true
    user: '1000:1000'
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=1777
      - /app/.next/cache:rw,noexec,nosuid,nodev,size=256m,uid=1000,gid=1000,mode=0700
    environment:
      TZ: ${TZ:-America/Regina}
      PORT: 5055
      SEERR_HTTPS_PORT: ${SEERR_HTTPS_PORT:-5056}
      SEERR_TLS_MODE: ${SEERR_TLS_MODE:-disabled}
      SEERR_TLS_HOSTS: ${SEERR_TLS_HOSTS:-localhost,127.0.0.1,::1}
      SEERR_ALLOW_HTTP_AUTH: ${SEERR_ALLOW_HTTP_AUTH:-false}
      CONFIG_DIRECTORY: /app/config
      SEERR_EXTERNAL_READ_ONLY: 'true'
      SEERR_ALLOW_PRODUCTION_EXTERNAL_READ_ONLY: 'true'
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '${SEERRNG_PORT:-5055}:5055'
      - '${SEERRNG_HTTPS_PORT:-5056}:5056'
    volumes:
      - ${SEERRNG_CONFIG_DIR:-./config}:/app/config
    healthcheck:
      test: ['CMD-SHELL', 'node /app/scripts/healthcheck.mjs']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
